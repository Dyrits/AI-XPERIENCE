<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Percy Setup</title>
<style>
  :root { --ink: #15121f; --paper: #fffdf6; --yellow: #ffd23f; --coral: #ff6b57; --mint: #7ee0b5; --desk: #cfc8f6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background-color: var(--desk); background-image: radial-gradient(rgba(21,18,31,.17) 1.2px, transparent 1.5px); background-size: 22px 22px;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink);
    display: grid; place-items: center; overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; }
  .mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  #win {
    position: relative; width: min(860px, 94vw); background: var(--paper); border: 3px solid var(--ink); border-radius: 14px;
    box-shadow: 8px 8px 0 var(--ink); transition: transform .9s cubic-bezier(.6,-0.2,.3,1.2), opacity .5s, width .35s;
  }
  #win.max { width: 98vw; }
  #win.mini { transform: translateY(80vh) scale(.08); opacity: 0; }
  #win.shake { animation: shake .45s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-9px) rotate(-.4deg); } 40% { transform: translateX(8px) rotate(.4deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }

  #bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 16px; background: var(--yellow); border-bottom: 3px solid var(--ink); border-radius: 11px 11px 0 0; font-weight: 800; font-size: 14px; }
  #bar .t { flex: 1; }
  #bar .v { font-size: 11px; opacity: .6; margin-right: 6px; }
  .wb { width: 27px; height: 27px; border: 2.5px solid var(--ink); border-radius: 7px; background: var(--paper); font-weight: 800; font-size: 14px; line-height: 1; cursor: pointer; }
  .wb:hover { background: var(--coral); }

  canvas { display: block; width: 100%; height: 300px; touch-action: manipulation; }
  #info { display: grid; grid-template-columns: 1fr auto; column-gap: 16px; padding: 0 22px 4px; align-items: end; }
  #task { font-weight: 800; font-size: 15px; grid-column: 1; }
  #eta { font-size: 13px; opacity: .65; grid-column: 1; min-height: 1.3em; }
  #pct { grid-column: 2; grid-row: 1 / span 2; font-weight: 800; font-size: clamp(32px, 7vw, 58px); line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }

  #ask { display: flex; gap: 10px; padding: 8px 22px 0; }
  #cwrap { display: flex; align-items: center; gap: 12px; padding: 10px 22px 0; font-size: 12px; font-weight: 700; }
  #cwrap .tr { flex: 1; height: 12px; border: 2.5px solid var(--ink); border-radius: 8px; background: #fff; overflow: hidden; }
  #cwrap i { display: block; height: 100%; width: 0; background: var(--coral); }
  #cpct { min-width: 4ch; text-align: right; }

  #foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 14px; padding: 14px 22px 18px; border-top: 3px dashed rgba(21,18,31,.25); }
  #foot .sp { flex: 1; }
  #foot label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
  #foot input { width: 17px; height: 17px; accent-color: var(--ink); }
  .btn {
    font-weight: 800; font-size: 14px; padding: 9px 16px; border: 3px solid var(--ink); border-radius: 10px; background: var(--paper);
    cursor: pointer; box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s, background .15s;
  }
  .btn:hover { background: var(--mint); }
  .btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .btn.pri { background: var(--yellow); }
  .btn.pri:hover { background: var(--mint); }
  .btn.sm { font-size: 12px; padding: 6px 11px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; background: var(--paper); }
  .btn:focus-visible, .wb:focus-visible, .ico:focus-visible { outline: 3px solid #3a6bff; outline-offset: 2px; }

  #done { position: absolute; left: 0; right: 0; top: 47px; bottom: 0; background: var(--paper); border-radius: 0 0 11px 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 18px 22px; text-align: center; animation: pop .5s cubic-bezier(.3,1.5,.5,1); overflow: auto; }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #done h2 { font-size: clamp(24px, 5vw, 38px); font-weight: 900; letter-spacing: -.01em; }
  #done .sub { font-size: 15px; font-weight: 700; opacity: .75; max-width: 46ch; }
  #done dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(560px, 100%); }
  #done dl div { border: 3px solid var(--ink); border-radius: 10px; padding: 8px 6px; background: #fff; box-shadow: 3px 3px 0 var(--ink); }
  #done dt { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; opacity: .6; }
  #done dd { font-size: 24px; font-weight: 900; }
  #verdict { font-weight: 800; font-size: 15px; background: var(--yellow); border: 3px solid var(--ink); border-radius: 10px; padding: 8px 14px; transform: rotate(-1.2deg); }
  #done .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  #icons { position: fixed; left: 26px; top: 26px; display: flex; flex-direction: column; gap: 22px; }
  .ico { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 7px; width: 96px; font-weight: 700; font-size: 12px; line-height: 1.15; cursor: pointer; text-align: center; }
  .ico i { display: block; position: relative; width: 44px; height: 52px; border: 3px solid var(--ink); border-radius: 6px; background: #fff; box-shadow: 3px 3px 0 var(--ink); }
  .ico i::after { content: ""; position: absolute; left: 7px; right: 7px; top: 11px; height: 22px; background: repeating-linear-gradient(var(--ink) 0 2.5px, transparent 2.5px 7px); }
  .ico.f i { height: 38px; margin-top: 7px; background: var(--yellow); border-radius: 4px 10px 6px 6px; }
  .ico.f i::before { content: ""; position: absolute; left: -3px; top: -11px; width: 20px; height: 9px; border: 3px solid var(--ink); border-bottom: 0; border-radius: 5px 5px 0 0; background: var(--yellow); }
  .ico.f i::after { display: none; }
  .ico.x i { background: var(--coral); }
  .ico span { padding: 2px 5px; border-radius: 4px; }
  .ico:hover span { background: var(--ink); color: #fff; }
  @media (max-width: 1180px) { #icons { display: none; } }
  @media (max-width: 520px) {
    canvas { height: 280px; }
    #foot { padding: 12px 14px 16px; }
    #done dd { font-size: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #win, #win.mini { transition: opacity .3s; }
    #win.shake, #done { animation: none; }
  }
</style>
</head>
<body>

<div id="icons">
  <button class="ico" id="icDoc"><i></i><span>Important_FINAL_v2 (1).docx</span></button>
  <button class="ico f" id="icFol"><i></i><span>New folder (47)</span></button>
  <button class="ico x" id="icNo"><i></i><span>DO NOT OPEN</span></button>
</div>

<main id="win">
  <div id="bar">
    <span class="t">Percy Setup</span>
    <span class="v mono">v0.99</span>
    <button class="wb" id="wMin" aria-label="Minimise">&ndash;</button>
    <button class="wb" id="wMax" aria-label="Maximise">+</button>
    <button class="wb" id="wX" aria-label="Close">&times;</button>
  </div>
  <canvas id="cv" aria-label="Percy, a progress bar with a face"></canvas>
  <div id="info">
    <div id="task"></div>
    <div id="pct" class="mono">0%</div>
    <div id="eta"></div>
  </div>
  <div id="ask" hidden>
    <button class="btn sm" id="aYes">Yes</button>
    <button class="btn sm" id="aNo">No</button>
  </div>
  <div id="cwrap" hidden>
    <span id="clabel">Cancelling&hellip;</span>
    <div class="tr"><i id="cfill"></i></div>
    <span id="cpct" class="mono">0%</span>
  </div>
  <div id="foot">
    <button class="btn sm" id="bSnd" aria-pressed="false">Sound: off</button>
    <label><input type="checkbox" id="chk"> Don't show this again</label>
    <span class="sp"></span>
    <button class="btn pri" id="bHurry">Hurry up</button>
    <button class="btn" id="bCancel">Cancel</button>
  </div>
  <section id="done" hidden>
    <h2>Loaded successfully.</h2>
    <p class="sub">Items loaded: 0. There was never anything to load. Percy just wanted someone to watch.</p>
    <dl>
      <div><dt>Waited</dt><dd id="rWait">0:00</dd></div>
      <div><dt>Wiggles</dt><dd id="rWig">0</dd></div>
      <div><dt>Hurry ups</dt><dd id="rHur">0</dd></div>
      <div><dt>Cancels</dt><dd id="rCan">0</dd></div>
      <div><dt>Pokes</dt><dd id="rPok">0</dd></div>
      <div><dt>Times you left</dt><dd id="rAway">0</dd></div>
    </dl>
    <p id="verdict"></p>
    <div class="row">
      <button class="btn pri" id="bAgain">Load again</button>
      <button class="btn" id="bBye">Close</button>
    </div>
  </section>
</main>
<div id="live" class="sr" aria-live="polite"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), win = $('win');
const INK = '#15121f', TAU = Math.PI * 2;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const clock = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
let dt = 0, W = 0, H = 0, DPR = 1;

/* Moods: each is a set of face parameters that the live face eases toward. */
const BASE = { curve: .15, open: 0, brow: 0, lift: 0, lid: 0, eye: 1, skew: 0, mw: 1, blush: 0, dz: 0 };
const MOOD = {};
const defMood = (name, tint, o) => { const [r, g, b] = hex(tint); MOOD[name] = Object.assign({}, BASE, o, { r, g, b }); };
defMood('neutral', '#ffd23f', {});
defMood('happy', '#ffd23f', { curve: 1, open: .8, lift: .15, mw: 1.1 });
defMood('worried', '#ffe27a', { curve: -.5, brow: -1, lift: .2, eye: 1.12 });
defMood('sad', '#9cc2ff', { curve: -1, open: .1, brow: -1, lift: .1, lid: .12, eye: 1.05 });
defMood('angry', '#ff6b57', { curve: -.55, open: .3, brow: 1, lid: .18, eye: .95 });
defMood('smug', '#ffd23f', { curve: .7, brow: .35, lid: .5, skew: 1 });
defMood('shocked', '#fff0a8', { curve: 0, open: 1.2, brow: -.3, lift: .45, eye: 1.3, mw: .45 });
defMood('dizzy', '#b6e36b', { curve: -.2, open: .3, dz: 1 });
defMood('shy', '#ffb3a7', { curve: .35, brow: -.5, lift: .1, lid: 1, blush: 1 });
defMood('bored', '#ffd23f', { curve: -.05, lid: .55, lift: -.05 });
const cur = Object.assign({}, MOOD.neutral);
let tgt = MOOD.neutral;

/* Pointer state outlives restarts. */
const P = { x: null, y: null, lx: .7, ly: .25, over: false };

/* Sound: tiny synth, off until the user turns it on. */
let ac = null, soundOn = false;
function tone(f, d = .08, type = 'square', v = .045, slide = 0, delay = 0) {
  if (!soundOn || !ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .03);
}
const BLIP = { neutral: 420, happy: 560, worried: 380, sad: 280, angry: 190, smug: 340, shocked: 700, dizzy: 300, shy: 520, bored: 240 };
const fanfare = () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .18, 'square', .05, 0, i * .11));
const sadSlide = () => tone(420, .6, 'sawtooth', .04, .4);

/* Game state. */
function freshState() {
  return {
    p: 0, digits: 0, vel: 0, frozen: 0, stutter: 0, time: 0, waited: 0, idle: 0, sinceReact: 99,
    reacting: false, resume: null, storyMood: 'neutral', lastStory: null, finished: false,
    task: '', eta: '', taskOverride: '', hurryRun: 0, cancelP: -1, answer: null,
    sq: 0, sqv: 0, rot: 0, spin: 0, blinkT: 2, blinkV: 0, stripe: 0, emT: 1, moveAcc: 0, wiggleCd: 0,
    mood: 'neutral', pokeT: 0, G: null,
    stats: { wiggle: 0, hurry: 0, cancel: 0, poke: 0, away: 0, closeX: 0 }
  };
}
let S = freshState();
let gen = null, parts = [];
const bub = { full: '', shown: 0, holdT: 0, done: true, vis: false, linger: 0, alpha: 0, pop: 0, pinned: false, lines: null, wrapW: 0 };
let runs = 0;
try { runs = +localStorage.getItem('percy-runs') || 0; } catch (e) {}

function setMood(m) {
  S.mood = m; tgt = MOOD[m] || MOOD.neutral;
  if (m === 'shocked') emit('text', S.G ? S.G.hx : 0, S.G ? S.G.hy - 50 : 0, '!');
}

/* Speech bubble. */
function say(text, o = {}) {
  bub.full = text; bub.shown = 0; bub.holdT = o.hold ?? 1.1; bub.pinned = bub.holdT > 50;
  bub.done = false; bub.vis = true; bub.pop = 1; bub.lines = null; bub.linger = 1.6;
  if (o.mood) setMood(o.mood);
  $('live').textContent = text;
}
function* speak(text, mood, hold) {
  const o = { mood, hold: hold ?? Math.min(2.4, .9 + text.length * .012) };
  S.lastStory = { text, o }; if (mood) S.storyMood = mood;
  say(text, o);
  while (!bub.done) yield;
}

/* Reactions interrupt the story: the bar stops while Percy deals with you. */
function react(text, mood, o = {}) {
  if (!o.force && (S.sinceReact < (o.gap ?? 2.5) || S.reacting)) return false;
  S.sinceReact = 0;
  if (!S.reacting) S.resume = ((!bub.done || bub.pinned) && S.lastStory && !S.finished) ? S.lastStory : null;
  S.reacting = true;
  say(text, { mood, hold: o.hold ?? Math.min(2.4, .9 + text.length * .012) });
  return true;
}

/* Story helpers. */
function* wait(s) { let t = 0; while (t < s) { t += dt; yield; } }
const speedMod = () => .55 + .9 * (.5 + .5 * Math.sin(S.time * 2.3 + Math.sin(S.time * .9) * 3));
function* moveTo(t, dur, o = {}) {
  const rate = Math.abs(t - S.p) / dur, dir = Math.sign(t - S.p) || 1;
  while ((t - S.p) * dir > .0005) {
    if (!o.fast && (S.frozen > 0 || S.stutter > 0)) { S.vel = 0; yield; continue; }
    const step = rate * dt * (o.fast ? 1 : speedMod());
    S.p += dir * Math.min(step, Math.abs(t - S.p)); S.vel = dir * step / Math.max(dt, .001);
    yield;
  }
  S.p = t; S.vel = 0;
}
const slide = (t, d) => moveTo(t, d, { fast: true });
function* ask(q, opts, timeout) {
  S.lastStory = { text: q, o: { hold: 99 } };
  say(q, { hold: 99 });
  S.answer = null;
  const box = $('ask'); $('aYes').textContent = opts[0]; $('aNo').textContent = opts[1]; box.hidden = false;
  let t = 0;
  while (S.answer === null && t < timeout) { t += dt; yield; }
  box.hidden = true; bub.pinned = false; bub.holdT = 0;
  return S.answer === null ? -1 : S.answer;
}
const setTask = t => { S.task = t; };
const setEta = t => { S.eta = t; };

/* Optional peek-a-boo beat: Percy loads fast only while the mouse is off the window. */
function* shyBeat() {
  setTask('Sulking in private');
  yield* speak('Could you look away? Move the mouse off this window. I get stage fright.', 'shy', 2.4);
  let t = 0, last = null, gaveUp = false;
  while (S.p < 63) {
    t += dt;
    const watched = P.over && t < 14;
    if (t >= 14 && !gaveUp) { gaveUp = true; say('Fine. I will load anyway. Rude.', { mood: 'angry', hold: 1 }); }
    if (!gaveUp && watched !== last) {
      if (last !== null) say(watched ? 'I can feel you looking.' : 'Thank you. Loading. Do not peek.', { mood: 'shy', hold: 1 });
      last = watched;
    }
    if (S.frozen <= 0) { const r = gaveUp ? 2.6 : (watched ? .15 : 3.6); S.p = Math.min(63, S.p + r * dt); S.vel = r; }
    yield;
  }
  S.vel = 0;
}

function* story() {
  const d = new Date(), h = d.getHours();
  setTask('Initialising initialisation'); setEta('Time remaining: calculating...');
  if (runs > 0) yield* speak(`Oh. Back again. Run number ${runs + 1}. Same bar, same Percy, same you.`, 'smug');
  else yield* speak("Hi. I'm Percy. I'll be loading things today.", 'happy');
  if (h < 5) yield* speak(`It's ${clock()}. Nobody sensible is awake. Welcome, you and me.`, 'smug');
  else if (d.getDay() === 1) yield* speak("It's Monday. I'm not looking forward to it either.", 'bored');
  else yield* speak("You don't have to watch. But you will. Everyone does.", 'smug');

  yield* moveTo(7, 2.6);
  setTask('Warming up the pixels'); setEta('Time remaining: about 40 seconds');
  yield* speak('Seven percent. Personal best, if we ignore the other times.', 'happy');
  yield* moveTo(15, 3.5);
  setTask('Asking the server nicely');
  yield* speak("The server said 'maybe'. In server, that's a yes.", 'neutral');
  yield* moveTo(24, 3.5);
  setTask('Reticulating splines');
  yield* speak('Reticulating splines. I have never seen a spline. I assume they are fine.', 'neutral');
  yield* moveTo(33, 3);
  setTask('Loading the thing that loads the thing'); setEta('Time remaining: 3 minutes (give or take a Tuesday)');
  yield* speak('Hm. This file needs a file that needs this file.', 'worried');
  yield* speak("That's a loop. I like loops. I do not like this loop.", 'worried', 1.2);
  sadSlide(); yield* slide(21, 1.3);
  yield* speak('Net progress: minus twelve. Technically a loss. Spiritually a stretch.', 'sad');
  setEta('Time remaining: -2 minutes (somehow ahead of schedule)');
  yield* moveTo(40, 4.5);
  yield* speak("Back on track. I didn't say which track.", 'smug');
  setTask('Compressing air');
  yield* moveTo(50, 4);
  setEta('Time remaining: yes');
  yield* speak('Halfway. Statistically the hard part is behind us. Statistically.', 'happy');
  yield* shyBeat();
  yield* speak('Thank you. I feel so much better. Watch this.', 'happy', .8);

  setTask('Dramatic foreshadowing');
  yield* slide(97, 1.3);
  yield* speak("WAIT. Is that. WE'RE ALMOST--", 'shocked', .6);
  yield* wait(.5);
  sadSlide(); yield* slide(58, .9);
  yield* speak('That was a rumour. Please disregard.', 'worried');

  setTask('Verifying your patience'); setEta('Time remaining: 12 seconds per percent');
  yield* moveTo(72, 5);
  const a = yield* ask('Quick question. Are you still watching?', ['Yes', 'No'], 8);
  if (a === 0) yield* speak('Wonderful. No pressure. Some pressure.', 'happy');
  else if (a === 1) yield* speak("Then who am I talking to? Never mind. Don't answer.", 'worried');
  else yield* speak('Silence. Cool. Cool cool cool.', 'sad');
  setTask('Hiding the spinners');
  yield* moveTo(81, 4);
  yield* speak('Eighty-one. I can see the end. It looks like a door.', 'happy');
  yield* moveTo(90, 4);
  setTask('Almost'); setEta('Time remaining: almost');
  yield* speak('Ninety. This is the part where it goes quickly.', 'smug');
  yield* moveTo(99, 3);

  setTask('Finalising the finalisation'); setEta(`Time remaining: 1 second (since ${clock()})`);
  yield* speak('Ninety-nine percent.', 'neutral', .5);
  yield* speak("The last one percent is also called 'the rest of the project'.", 'smug');
  const Z = [
    [99.9, 'Ninety-nine point nine. I can smell the hundred.', 'happy'],
    [99.99, 'Zeno would be proud. Zeno also never finished anything.', 'worried'],
    [99.999, 'Each nine is a promise. I keep none of them.', 'sad'],
    [99.9999, "Okay. Okay okay okay. Deep breath. I don't breathe.", 'shocked']
  ];
  for (let i = 0; i < Z.length; i++) {
    S.digits = i + 1;
    yield* moveTo(Z[i][0], 2);
    yield* speak(Z[i][1], Z[i][2], 1.5);
    yield* wait(1);
  }
  yield* moveTo(100, 1.6);
  S.digits = 0; S.p = 100;
  setTask('Done'); setEta('Time remaining: none. Look at that.');
  fanfare(); confetti();
  yield* speak('One hundred percent!', 'happy', 1);
  yield* speak('Loaded! Loaded what? ...Good question.', 'neutral', 1.4);
  for (let i = 0; i < 5; i++) emit('tear', S.G.hx + (i % 2 ? 1 : -1) * S.G.R * .38, S.G.hy);
  yield* speak('Nothing. There was never anything to load. I just wanted someone to watch.', 'happy', 2.6);
  yield* wait(.3);
  finish();
}

/* Finish, results and restart. */
function finish() {
  S.finished = true; runs++;
  try { localStorage.setItem('percy-runs', runs); } catch (e) {}
  const st = S.stats, w = Math.round(S.waited);
  $('rWait').textContent = Math.floor(w / 60) + ':' + String(w % 60).padStart(2, '0');
  $('rWig').textContent = st.wiggle; $('rHur').textContent = st.hurry; $('rCan').textContent = st.cancel;
  $('rPok').textContent = st.poke; $('rAway').textContent = st.away;
  let v;
  if (st.hurry >= 8) v = 'Verdict: impatient. Percy forgives you. Mostly.';
  else if (st.cancel >= 3) v = 'Verdict: commitment issues. Percy is not judging. Percy is judging.';

  const task = S.taskOverride || S.task;
  if ($('task').textContent !== task) $('task').textContent = task;
  if ($('eta').textContent !== S.eta) $('eta').textContent = S.eta;
  S.tt = (S.tt || 0) - dt;
  if (S.tt <= 0 && !document.hidden) { S.tt = .3; document.title = (S.finished ? 'Done' : 'Loading... ' + pt) + ' | Percy Setup'; }
}

/* Input. */
function sizeCanvas() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  bub.lines = null;
}
new ResizeObserver(sizeCanvas).observe(cv);

addEventListener('pointermove', e => {
  if (P.x !== null) S.moveAcc += Math.hypot(e.clientX - P.x, e.clientY - P.y);
  P.x = e.clientX; P.y = e.clientY; S.idle = 0;
  P.over = e.pointerType === 'touch' ? false : !!(e.target.closest && e.target.closest('#win'));
});
addEventListener('pointerdown', () => { S.idle = 0; });
addEventListener('pointerup', e => { if (e.pointerType === 'touch') P.over = false; });
document.documentElement.addEventListener('mouseleave', () => { P.over = false; });
addEventListener('blur', () => { P.over = false; });
addEventListener('keydown', e => {
  S.idle = 0;
  if (e.key === 'Escape') react("Escape isn't a cancel either. Nothing here is a cancel.", 'smug', { gap: 3 });
});

cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect(), G = S.G; if (!G) return;
  cv.style.cursor = Math.hypot(e.clientX - r.left - G.hx, e.clientY - r.top - G.hy) < G.R * 1.05 ? 'pointer' : 'default';
});
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect(), G = S.G, x = e.clientX - r.left, y = e.clientY - r.top;
  if (Math.hypot(x - G.hx, y - G.hy) < G.R * 1.05) poke();
  else if (Math.abs(y - G.y) < G.barH / 2 + 4 && x > G.L - G.barH / 2 && x < G.Rr + G.barH / 2) {
    S.sqv = -3; react("That's my body. Please be normal about it.", 'shy', { gap: 3 });
  }
});

$('bHurry').addEventListener('click', onHurry);
$('bCancel').addEventListener('click', onCancel);
$('aYes').addEventListener('click', () => { S.answer = 0; tone(700, .05); });
$('aNo').addEventListener('click', () => { S.answer = 1; tone(400, .05); });
$('bAgain').addEventListener('click', restart);
$('bBye').addEventListener('click', () => {
  $('done').hidden = true;
  say("Bye. You'll be back. They always are.", { mood: 'smug', hold: 3 });
});
$('bSnd').addEventListener('click', e => {
  soundOn = !soundOn;
  if (soundOn && !ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac && ac.state === 'suspended') ac.resume();
  e.currentTarget.textContent = 'Sound: ' + (soundOn ? 'on' : 'off'); e.currentTarget.setAttribute('aria-pressed', soundOn);
  tone(880, .08);
});
$('chk').addEventListener('change', e => {
  if (!e.target.checked) return;
  react("I unchecked that for you. You're welcome.", 'smug', { force: true });
  setTimeout(() => { $('chk').checked = false; }, 700);
});
$('wX').addEventListener('click', () => {
  S.stats.closeX++; shake(); tone(200, .12, 'sawtooth');
  react("That's the X. The X is a decoration. It is there for morale.", 'smug', { force: true });
});
$('wMax').addEventListener('click', () => {
  win.classList.toggle('max'); tone(500, .06);
  react("I'm not any bigger. I just feel taller.", 'happy', { gap: 1 });
});
$('wMin').addEventListener('click', () => {
  win.classList.add('mini'); tone(500, .3, 'sine', .05, .4);
  setTimeout(() => {
    win.classList.remove('mini');
    react('Back. That was the longest second of my life.', 'worried', { force: true });
  }, reduce ? 500 : 1500);
});
$('icDoc').addEventListener('click', () => react("Not now. I'm in the middle of something. So are you, apparently.", 'smug', { gap: 1 }));
$('icFol').addEventListener('click', () => react("It's empty. They are all empty. Forty-seven empty folders.", 'sad', { gap: 1 }));
$('icNo').addEventListener('click', () => { shake(); react('I said DO NOT. It was in capital letters.', 'angry', { force: true }); });

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { S.leftAt = performance.now(); document.title = 'Percy: hello?'; return; }
  const away = (performance.now() - (S.leftAt || performance.now())) / 1000;
  if (away > 2 && !S.finished) {
    S.stats.away++;
    if (away > 30) react(`You were gone ${Math.round(away)} seconds. I counted. I had nothing else to do.`, 'angry', { force: true });
    else react("Oh. You're back. I wasn't crying. That's loading fluid.", 'sad', { force: true });
  }
});

/* Go. */
sizeCanvas();
S.G = layout();
gen = story();
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  dt = Math.min(.05, (now - last) / 1000); last = now;
  update(); draw();
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
