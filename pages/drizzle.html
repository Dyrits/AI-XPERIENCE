<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#15131f">
<title>Drizzle</title>
<style>
:root{color-scheme:dark;--ink:#f4ecde;--dim:#a79fb8;--sun:#ffd27a;--bg:#15131f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:ui-rounded,'SF Pro Rounded','Nunito','Trebuchet MS',system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
#stage{position:relative;width:min(100vw,calc((100vh - 72px) * 16 / 9));aspect-ratio:16/9;background:#000;overflow:hidden;box-shadow:0 24px 80px #0008}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#cap{position:absolute;left:3.2%;bottom:5%;font-size:clamp(11px,1.45vw,20px);letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 2px 12px #0006;opacity:0;pointer-events:none}
#cap.show{animation:capin 3.6s ease both}
#cap b{font-weight:800;color:var(--sun);margin-right:.7em}
@keyframes capin{0%{opacity:0;transform:translateY(8px)}12%,78%{opacity:1;transform:none}100%{opacity:0}}
#start,#again{position:absolute;inset:auto 0 7% 0;display:flex;flex-direction:column;align-items:center;gap:12px}
#start[hidden],#again[hidden]{display:none}
#start .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.big{border:0;border-radius:999px;padding:.85em 1.7em;font-weight:800;font-size:clamp(13px,1.6vw,20px);background:var(--sun);color:#2b2040;box-shadow:0 8px 24px #0005;transition:transform .15s}
.big:hover{transform:translateY(-2px) scale(1.03)}
.big.alt{background:#ffffff26;color:#fff;backdrop-filter:blur(6px)}
#start p{margin:0;font-size:clamp(11px,1.2vw,15px);color:#fff;text-shadow:0 2px 10px #0008}
#bar{width:min(100vw,calc((100vh - 72px) * 16 / 9));height:72px;display:flex;align-items:center;gap:12px;padding:0 4px}
#bar button{background:none;border:1px solid #ffffff26;border-radius:999px;padding:.45em .9em;font-size:13px;white-space:nowrap}
#bar button:hover{background:#ffffff14}
#pp{min-width:5.4em}
#seek{flex:1;min-width:60px;accent-color:var(--sun)}
#clock{font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim);white-space:nowrap}
#chap{display:flex;gap:4px}
#chap button{padding:.45em .65em;font-size:12px}
#chap button.on{background:var(--sun);color:#2b2040;border-color:var(--sun)}
@media (max-width:820px){#chap,#clock{display:none}}
@media (prefers-reduced-motion:reduce){#cap.show{animation:none;opacity:1}}
</style>
</head>
<body>
<div id="stage">
<canvas id="scene" role="img" aria-label="Animated short film without words. A very dry valley with one wilted sunflower. Three huge storm clouds sail past without raining, and a tiny cloud named Drizzle tries and fails to follow. Left behind, Drizzle cannot make rain on purpose, until a tear of affection for the sunflower becomes the first drop. The valley turns green, a rainbow rises, and the tiny cloud falls asleep on the sunflower's head."></canvas>
<div id="cap" aria-live="polite"></div>
<div id="start"><div class="row"><button id="goSound" class="big">Play with sound</button><button id="goSilent" class="big alt">Play silent</button></div><p>An animated short in seven scenes. 1 min 34, no words.</p></div>
<div id="again" hidden><button id="replay" class="big">Watch again</button></div>
</div>
<div id="bar">
<button id="pp" aria-label="Play">Play</button>
<input id="seek" type="range" min="0" max="94" step="0.05" value="0" aria-label="Timeline" disabled>
<span id="clock">0:00 / 1:34</span>
<nav id="chap" aria-label="Scenes"></nav>
<button id="snd" aria-pressed="false">Sound off</button>
<button id="fs" aria-label="Fullscreen">Full</button>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const TAU=Math.PI*2,W=1280,H=720,DUR=94,POSTER=3.6;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>{t=clamp(t);return t*t*(3-2*t)};
const ss=(a,b,x)=>sm((x-a)/(b-a));
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const eob=u=>{u=clamp(u);return 1+2.7*Math.pow(u-1,3)+1.7*Math.pow(u-1,2)};

// Smoothstep between keys: for parameters that ease in and out.
function tr(t,k){
  if(t<=k[0][0])return k[0][1];
  for(let i=1;i<k.length;i++)if(t<k[i][0]){const a=k[i-1],b=k[i];return lerp(a[1],b[1],sm((t-a[0])/(b[0]-a[0])))}

}
// Catmull-Rom through keys: for continuous motion that should not stop at every key.
function cr(t,k){
  const n=k.length;
  if(t<=k[0][0])return k[0][1];
  if(t>=k[n-1][0])return k[n-1][1];
  let i=1;while(t>=k[i][0])i++;
  const p0=k[Math.max(i-2,0)],p1=k[i-1],p2=k[i],p3=k[Math.min(i+1,n-1)],h=p2[0]-p1[0],u=(t-p1[0])/h;
  const m1=(p2[1]-p0[1])/(p2[0]-p0[0])*h,m2=(p3[1]-p1[1])/(p3[0]-p1[0])*h,u2=u*u,u3=u2*u;
  return(2*u3-3*u2+1)*p1[1]+(u3-2*u2+u)*m1+(-2*u3+3*u2)*p2[1]+(u3-u2)*m2;
}

const rgbCache={};
const rgbOf=h=>rgbCache[h]||(rgbCache[h]=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
const mixA=(a,b,t,al=1)=>{const A=rgbOf(a),B=rgbOf(b);return`rgba(${A[0]+(B[0]-A[0])*t|0},${A[1]+(B[1]-A[1])*t|0},${A[2]+(B[2]-A[2])*t|0},${al})`};
const al=(h,a)=>mixA(h,h,0,a);
function pal(t,keys){
  let i=0;while(i<keys.length-1&&t>=keys[i+1][0])i++;
  const a=keys[i],b=keys[Math.min(i+1,keys.length-1)],u=a===b?0:sm((t-a[0])/(b[0]-a[0])),out=[];
  for(let k=1;k<a.length;k++)out.push(mixA(a[k],b[k],u));
  return out;
}

const cv=$('#scene'),c=cv.getContext('2d'),stage=$('#stage');
let K=1;
function resize(){const r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.75);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);K=cv.width/W}
addEventListener('resize',resize);

const el=(x,y,rx,ry,f,rot=0)=>{c.beginPath();c.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot,0,TAU);c.fillStyle=f;c.fill()};
const circ=(x,y,r,f)=>{c.beginPath();c.arc(x,y,Math.max(.01,r),0,TAU);c.fillStyle=f;c.fill()};
function glow(x,y,r,col,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,al(col,a));g.addColorStop(1,al(col,0));c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)}
function star(x,y,r,a,col='#fff6c8'){c.save();c.globalAlpha=clamp(a);c.translate(x,y);c.fillStyle=col;c.beginPath();c.moveTo(0,-r);c.quadraticCurveTo(r*.14,-r*.14,r,0);c.quadraticCurveTo(r*.14,r*.14,0,r);c.quadraticCurveTo(-r*.14,r*.14,-r,0);c.quadraticCurveTo(-r*.14,-r*.14,0,-r);c.fill();c.restore()}

// ---------- world constants and timelines ----------
const DX=820,DY=612;
const SKY=[[0,'#8bb3d3','#f9dcab'],[13,'#8bb3d3','#f9dcab'],[17,'#6a86a6','#dcc196'],[27,'#6a86a6','#dcc196'],[31,'#89a8c3','#efd6ac'],[60,'#85a4bf','#ead0a5'],[66,'#6fa8d6','#f2e0b8'],[76,'#4faaf0','#fff1c9'],[82,'#6aa4e0','#ffe3b6'],[88,'#6a73c2','#ffb98a'],[94,'#5560ae','#ff9f78']];
const TONE=[[0,'#ffffff'],[14,'#ffffff'],[17,'#a5accb'],[26,'#a5accb'],[30,'#eef0f8'],[56,'#e0e5f3'],[63,'#cdd5ec'],[70,'#f4f6ff'],[76,'#ffffff'],[84,'#fff0df'],[94,'#f2cdbb']];
const RAD_K=[[0,0],[61.3,0],[62.3,70],[66,280],[70,500],[74,720],[78,930],[82,1100]];
const RAIN_I=[[0,0],[63.3,0],[64.2,.12],[66,.5],[68,.9],[74,.85],[78,.45],[80.5,.05],[81.5,0]];
const WILT=[[0,1],[61.4,1],[62,.88],[64,.55],[66.5,.2],[70,0],[94,0]];
const WIND=[[0,0],[12,1],[17,12],[27,40],[32,48],[60,60],[70,75],[82,95],[94,100]];
const SC=[[0,1],[40,1],[52,.96],[60,.93],[64,.92],[68,.84],[76,.62],[80,.5],[84,.44],[94,.42]];
const SY=[[0,1],[27.1,1],[27.25,1.25],[27.6,.8],[28,1],[40.3,1],[41.8,1.1],[42.4,1.15],[42.55,.78],[43,1.05],[43.6,1],[44.8,1],[45.5,.78],[46.2,1.22],[46.8,.86],[47,1.15],[47.2,.9],[47.6,1],[48.9,1],[50.2,1.12],[50.35,.8],[50.8,1],[51.5,.86],[53,.84],[57,.88],[59,.95],[60,1],[84,1],[88,.96],[94,.97]];
const DZX=[[0,-500],[19.5,-500],[23,-80],[26,330],[27.2,480],[28.3,420],[29.6,300],[31,420],[33.5,560],[36,740],[38.2,806],[52,808],[54,860],[56.5,940],[58,930],[59.5,830],[60.6,778],[63,778],[64.5,800],[67,1010],[70,640],[73,980],[76,720],[79,820],[84,800],[88,822],[94,822]];
const DZY=[[0,280],[19.5,280],[23,270],[26,262],[27.2,262],[28.4,200],[29.6,270],[31,340],[33,320],[36,305],[38.2,296],[44,300],[52,308],[56.5,290],[59.5,292],[60.6,300],[64,300],[67,240],[70,200],[73,215],[76,190],[79,205],[82,215],[86,232],[90,224],[94,220]];
const CAMZ=[[0,1],[13,1.14],[16,1],[28,1],[30,1.12],[40,1.16],[42,1.3],[53,1.3],[55,1.5],[61,1.55],[63,1.2],[67,1],[80,1],[83,1.2],[94,1.28]];
const CAMX=[[0,700],[13,790],[16,700],[28,680],[30,730],[40,780],[42,810],[55,810],[61,812],[63,800],[67,660],[80,660],[83,820],[94,830]];
const CAMY=[[0,380],[13,400],[16,360],[28,340],[30,380],[40,370],[42,350],[53,350],[55,370],[61,430],[63,380],[67,360],[80,360],[83,340],[94,330]];
const BIG=[
 {sc:1.5,y:150,fsc:.5,a:[[0,-800],[12,-800],[16,40],[20,540],[24,1000],[28.5,1650]],b:[[72.5,1950],[76,1750],[81,1500],[85,1290],[94,1270]]},
 {sc:1.15,y:195,fsc:.55,a:[[0,-900],[13,-900],[17.5,-120],[21.5,420],[25.5,980],[29,1600]],b:[[78,-420],[82,-220],[86,10],[94,50]]},
 {sc:1.3,y:175,fsc:.5,a:[[0,-1000],[14,-1000],[18.5,-300],[23,330],[26.5,780],[28.7,1010],[32,1750]],b:[[72.5,1800],[76,1480],[80,1160],[84,1110],[94,1120]]}];
const CH=[[0,'I','A dry valley'],[13,'II','The big ones'],[28,'III','Left behind'],[40,'IV','Trying'],[54,'V','The smallest thing'],[64,'VI','Rain'],[82,'VII','Evening']];
const bigPos=(i,t)=>{const B=BIG[i];return t<40?{x:cr(t,B.a),y:B.y+Math.sin(t*.8+i)*8,sc:B.sc}:{x:cr(t,B.b),y:B.y+Math.sin(t*.8+i)*8-(i===0?0:0),sc:B.sc*B.fsc}};

function dzPos(t){
  let x=cr(t,DZX),y=cr(t,DZY);
  const run=ss(19.5,20.5,t)*(1-ss(26.8,27.2,t));
  y-=Math.abs(Math.sin(t*7.5))*16*run;
  y+=Math.sin(t*2.1)*5*(1-run);
  y+=tr(t,[[0,0],[45,0],[45.5,16],[46.3,-80],[46.9,8],[47.3,0]]);
  const sh=tr(t,[[0,0],[49,0],[49.4,1],[50.2,1],[50.4,0]])+tr(t,[[0,0],[40.8,0],[41.2,.5],[42.3,.5],[42.5,0]])*.6;
  x+=Math.sin(t*58)*3.4*sh;
  return{x,y,sc:tr(t,SC)};
}
function dotPose(t){
  const w=tr(t,WILT),joy=ss(65,69,t)*(1-ss(80,84,t));
  const sway=Math.sin(t*2.1)*.025*(1-w)+Math.sin(t*5.2)*.06*joy;
  const top={x:DX+w*52+sway*120,y:DY-216+w*58},ang=w*1.45+sway;
  return{w,joy,sway,top,ang,tilt:ang*.45,hc:{x:top.x+Math.sin(ang)*60,y:top.y-Math.cos(ang)*60}};
}
const blink=(t,s)=>{const p=(t+s*1.7)%3.4;return p<.14?Math.sin(p/.14*Math.PI):0};

// ---------- characters ----------
function cloud(circles,col,tint,tintA){
  const base=tint?mixA(col.base,tint,tintA):col.base,shade=tint?mixA(col.shade,tint,tintA*.6):col.shade;
  for(const[x,y,r]of circles){
    const g=c.createRadialGradient(x-r*.28,y-r*.42,0,x-r*.28,y-r*.42,r*1.5);
    g.addColorStop(0,col.hi);g.addColorStop(.42,base);g.addColorStop(1,shade);
    circ(x,y,r,g);
  }
}
function face(x,y,s,f){
  const er=(f.er||1)*15*s,gap=27*s*(f.gap||1),op=clamp(f.open===undefined?1:f.open,0,1.1),ink=f.ink||'#3a3150';
  const lidE=Math.max(f.lid||0,Math.max(0,-(f.brow||0))*.35),ir=er*.68,iris=f.iris||['#6d93d8','#1d2c66'];
  for(const sd of[-1,1]){
    const ex=x+sd*gap,ry=er*1.22*Math.max(op,.04);
    if(op<.16){
      c.strokeStyle=f.browC||ink;c.lineWidth=er*.3;c.lineCap='round';c.beginPath();c.moveTo(ex-er*.9,y);c.quadraticCurveTo(ex,y+er*.55*(1-op/.16*.6),ex+er*.9,y);c.stroke();
      if(f.brows!==false){const by=y-er*1.5,b=f.brow||0;c.beginPath();c.moveTo(ex-sd*er*.75,by-b*er*.55);c.lineTo(ex+sd*er*.9,by+b*er*.22);c.stroke()}
      if(f.blush>0)el(x+sd*gap*1.32,y+er*1.5,er*.85,er*.5,`rgba(255,110,150,${.4*clamp(f.blush)})`);
      continue;
    }
    c.save();c.beginPath();c.ellipse(ex,y,er,ry,0,0,TAU);c.clip();
    const g=c.createLinearGradient(0,y-ry,0,y+ry);g.addColorStop(0,'#dfe5f2');g.addColorStop(.3,'#fff');g.addColorStop(1,'#fdfdff');
    c.fillStyle=g;c.fillRect(ex-er,y-ry,er*2,ry*2);
    const ix=ex+(f.lx||0)*(er-ir)*.9,iy=y+(f.ly||0)*(ry-ir)*.9+.0001;
    const ig=c.createRadialGradient(ix,iy+ir*.25,ir*.1,ix,iy,ir);ig.addColorStop(0,iris[0]);ig.addColorStop(1,iris[1]);
    circ(ix,iy,ir,ig);circ(ix,iy,ir*.5,'#0d1030');
    circ(ix-ir*.32,iy-ir*.36,ir*.34,'rgba(255,255,255,.95)');circ(ix+ir*.36,iy+ir*.34,ir*.15,'rgba(255,255,255,.75)');
    if(f.wet>0){const h=ry*2*clamp(f.wet)*.62;c.fillStyle='rgba(150,205,255,.42)';c.fillRect(ex-er,y+ry-h,er*2,h);c.fillStyle='rgba(255,255,255,.7)';c.fillRect(ex-er,y+ry-h,er*2,1.6*s)}
    if(lidE>.01){
      const h=ry*2*lidE,sl=-(f.brow||0)*er*.35,yi=y-ry+h+Math.max(0,sl),yo=y-ry+h-Math.max(0,sl)*.4;
      c.fillStyle=f.lidC||'#fff';c.beginPath();c.moveTo(ex-er-2,y-ry-2);c.lineTo(ex+er+2,y-ry-2);
      if(sd<0){c.lineTo(ex+er+2,yi);c.lineTo(ex-er-2,yo)}else{c.lineTo(ex+er+2,yo);c.lineTo(ex-er-2,yi)}
      c.fill();
    }
    c.restore();
    if(f.brows!==false){
      const by=y-er*1.62-(f.bl||0)*er*.55,b=f.brow||0;
      c.strokeStyle=f.browC||ink;c.lineWidth=er*.34;c.lineCap='round';c.beginPath();
      const ix2=ex-sd*er*.75,iy2=by-b*er*.55,ox=ex+sd*er*.9,oy=by+b*er*.22;
      c.moveTo(ix2,iy2);c.quadraticCurveTo((ix2+ox)/2,Math.min(iy2,oy)-er*.22,ox,oy);c.stroke();
    }
    if(f.blush>0)el(x+sd*gap*1.32,y+er*1.5,er*.85,er*.5,`rgba(255,110,150,${.4*clamp(f.blush)})`);
    if(f.tear>0&&sd>0){
      const p=clamp(f.tear),tx=lerp(ex+er*.15,ex+er*.6,p),ty=lerp(y+ry*.7,y+er*2.6,p);
      c.strokeStyle='rgba(170,215,255,.55)';c.lineWidth=er*.2;c.beginPath();c.moveTo(ex+er*.15,y+ry*.7);c.lineTo(tx,ty);c.stroke();
      el(tx,ty,er*.26,er*.36,'rgba(190,225,255,.95)');circ(tx-er*.08,ty-er*.1,er*.09,'#fff');
    }
  }
  const sm_=f.smile||0,mo=clamp(f.mo||0),mw=er*1.1*(1+.25*sm_*(1-mo*.4)),my=y+er*2.15,cy=my-sm_*er*.35;
  if(mo>.05){
    const depth=er*(.2+mo*1.5)+Math.max(0,sm_)*er*.3;
    c.beginPath();c.moveTo(x-mw,cy);c.quadraticCurveTo(x,cy-er*.12+Math.max(0,-sm_)*-er*.5,x+mw,cy);c.quadraticCurveTo(x,cy+depth*1.7,x-mw,cy);c.closePath();
    c.fillStyle='#5b2a3e';c.fill();c.save();c.clip();el(x,cy+depth*1.25,mw*.6,depth*.5,'#f08a9a');c.restore();
  }else{
    c.strokeStyle=f.mouthC||'#4a2a3e';c.lineWidth=er*.3;c.lineCap='round';c.beginPath();c.moveTo(x-mw,cy);c.quadraticCurveTo(x,cy+sm_*er*1.1,x+mw,cy);c.stroke();
  }
}

const DZ_COL={base:'#eef4fb',hi:'#ffffff',shade:'#a9bfe0'};
const DZ_CIRC=[[-46,14,34],[-18,-6,44],[22,-2,46],[50,16,32],[-4,26,38],[24,26,32],[-30,28,30]];
function dzFace(t,p){
  const tn=x=>tr(t,x),dp=dotPose(t),gD=tn([[0,0],[30,0],[31.5,1],[51.3,1],[51.8,0],[53,0],[53.8,1],[94,1]]);
  const dx=dp.hc.x-p.x,dy=dp.hc.y-p.y,dl=Math.hypot(dx,dy)||1;
  let lx=tn([[0,.8],[27,.9],[27.1,0],[31.5,0],[32.2,.9],[35,.9],[53,.8],[57,.8],[80,.9],[83.5,.9]]);
  let ly=tn([[0,-.1],[27,-.3],[32,-.2],[53,.1],[80,-.4]]);

  const dz=ss(28,28.4,t)*(1-ss(30.8,31.4,t));
  lx=lerp(lx,.75*Math.cos(t*9),dz);ly=lerp(ly,.75*Math.sin(t*9),dz);
  const laugh=Math.sin(t*14)*.2*ss(64,66,t)*(1-ss(79,82,t));
  const tp1=tn([[59.2,0],[61,1]]),tp2=tn([[62.6,0],[63.6,1]]);
  const tear=t<62?(t>=61?0:tp1):(t>=63.6?0:tp2);
  const open=tn([[0,1],[27,1],[27.15,.12],[27.9,.5],[28.2,1],[40.3,1],[41.5,.25],[42.4,.25],[42.7,1],[45.3,.4],[46.8,.2],[47.2,1],[49.1,.25],[50.2,.15],[50.6,1],[51.5,.7],[56,.6],[58,.8],[59,1],[84,1],[88,.7],[93,.45],[94,.4]]);
  return{

  // Scene V: the smallest thing.
  ev(54,w=>pad(w,[45,52,57,60],7,.55));
  for(let k=0;k<9;k++){const t=55+k*.65;ev(t,w=>piano(w,[57,60,64,69][k%4],1.2,.45))}
  ev(61.5,w=>{glock(w,88,2,.9);glock(w+.12,95,2,.4)});
  ev(61.6,w=>pad(w,[48,55,60,64],8,.7));
  notes([[62.4,67,1.4,.7],[63,64,1.4,.7],[63.6,67,1.4,.7],[64.2,69,1.8,.8],[65.4,67],[66,64],[66.6,62],[67.8,60,2.2]],glock);
  // Scene VI: rain, harp and the sun coming out.
  const prog=[[48,[48,52,55,60,64,67]],[43,[43,47,50,55,59,62]],[45,[45,52,57,60,64,69]],[41,[41,48,53,57,60,65]]];
  for(let b=0;b<8;b++){const t=64.4+b*2.4,[r,ch]=prog[b%4];
    ev(t,w=>bass(w,r-12,2.2,.8));ev(t,w=>pad(w,ch.slice(0,4),2.6,.55));
    const seq=[0,1,2,3,4,5,4,3];seq.forEach((s,i)=>ev(t+i*.3,w=>pluck(w,ch[s]+12,.6,.4)))}
  notes([[66.4,79,1.2,.7],[67,76,1.2,.7],[67.6,79,1.2,.7],[68.2,81,1.6,.8],[69.4,79,1.2,.7],[70,76],[70.6,74],[71.8,72,2],[73.4,79,1.2,.7],[74,76,1.2,.7]],glock);
  ev(74.4,w=>{pad(w,[48,55,60,64,67,72],6,.9);[72,76,79,84,88,91].forEach((m,i)=>glock(w+i*.11,m,2,.7));noiseHit(w,2.2,'highpass',5000,9000,.06,.8,.4)});
  notes([[76,84,1.5,.6],[76.6,81,1.5,.6],[77.2,79,1.5,.6],[77.8,76,1.5,.6],[78.4,79,1.5,.6],[79,84,2.4,.7]],glock);
  // Scene VII: evening lullaby.
  ev(82,w=>pad(w,[41,48,53,57,60],6.2,.6));ev(88,w=>pad(w,[48,55,60,64],6,.5));
  notes([[84.4,67,1.4,.55],[85.4,64,1.4,.55],[86.4,67,1.4,.55],[87.4,69,1.8,.55],[89.6,67,1.4,.5],[90.6,64,1.4,.5],[91.6,62,1.4,.45],[93,60,3,.4]],glock);
  EV.sort((a,b)=>a[0]-b[0]);
})();
const RUM=[[0,0],[10,0],[12,.8],[13,.35],[16,.55],[26,.55],[29,0],[94,0]];
function audioStep(){
  if(!ac)return;
  const now=ac.currentTime,on=soundOn&&playing;
  master.gain.setTargetAtTime(on?.85:0,now,.05);
  if(!on)return;
  rainG.gain.setTargetAtTime(tr(t,RAIN_I)*.09+tr(t,[[85,0],[89,.2],[94,.2]])*.3,now,.15);
  windG.gain.setTargetAtTime(.05*(1-ss(62,70,t))+.09*ss(11,14,t)*(1-ss(26,29,t)),now,.3);
  rumbleG.gain.setTargetAtTime(tr(t,RUM)*.7,now,.2);
  while(evIdx<EV.length&&EV[evIdx][0]<t+.15){const e=EV[evIdx++];if(e[0]>=t-.05)e[1](now+Math.max(.005,e[0]-t))}
}

// ---------- playback and controls ----------
let t=POSTER,playing=false,started=false,soundOn=false,last=0,chap=-1;
const seek=$('#seek'),pp=$('#pp'),clock=$('#clock'),cap=$('#cap'),chapNav=$('#chap');
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
CH.forEach(([at,n,name],i)=>{const b=document.createElement('button');b.textContent=n;b.title=name;b.setAttribute('aria-label',`Scene ${n}: ${name}`);b.onclick=()=>{begin();jump(at)};chapNav.appendChild(b)});
function jump(x){
  t=clamp(x,0,DUR);evIdx=EV.findIndex(e=>e[0]>=t);if(evIdx<0)evIdx=EV.length;newSeg();
  $('#again').hidden=true;
}
function setPlaying(v){
  playing=v;pp.textContent=v?'Pause':'Play';pp.setAttribute('aria-label',v?'Pause':'Play');
  if(v){if(t>=DUR)jump(0);else newSeg();evIdx=EV.findIndex(e=>e[0]>=t);if(evIdx<0)evIdx=EV.length;$('#again').hidden=true}
}
function begin(){if(started)return;started=true;$('#start').hidden=true;seek.disabled=false;if(t===POSTER)jump(0)}
function setSound(v){
  if(v&&!ac&&!initAudio()){$('#snd').textContent='No audio';return}
  soundOn=v;$('#snd').textContent=v?'Sound on':'Sound off';$('#snd').setAttribute('aria-pressed',v);
  if(ac&&v)ac.resume();
}
$('#goSound').onclick=()=>{begin();setSound(true);setPlaying(true)};
$('#goSilent').onclick=()=>{begin();setPlaying(true)};
pp.onclick=()=>{if(!started){begin();setPlaying(true)}else setPlaying(!playing)};
$('#replay').onclick=()=>{jump(0);setPlaying(true)};
$('#snd').onclick=()=>setSound(!soundOn);
$('#fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen&&stage.requestFullscreen()};
seek.oninput=()=>jump(+seek.value);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)setPlaying(false)});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;
  const k=e.key;
  if(k===' '||k==='k'||k==='K'){if(e.target.tagName==='BUTTON')return;e.preventDefault();pp.click()}
  else if(k==='ArrowRight'&&started){jump(t+5)}
  else if(k==='ArrowLeft'&&started){jump(t-5)}
  else if(k==='m'||k==='M')setSound(!soundOn);
  else if(k==='r'||k==='R'){begin();jump(0);setPlaying(true)}
  else if(k==='f'||k==='F')$('#fs').click();
  else if(/^[1-7]$/.test(k)){begin();jump(CH[k-1][0])}
});
function ui(){
  const i=CH.reduce((a,[at],j)=>t>=at?j:a,0);
  if(started&&i!==chap){chap=i;cap.innerHTML=`<b>${CH[i][1]}</b>${CH[i][2]}`;cap.classList.remove('show');void cap.offsetWidth;cap.classList.add('show');[...chapNav.children].forEach((b,j)=>b.classList.toggle('on',j===i))}
  if(document.activeElement!==seek||playing)seek.value=t;
  clock.textContent=`${fmt(t)} / ${fmt(DUR)}`;
  if(t>=DUR&&playing){playing=false;pp.textContent='Play';pp.setAttribute('aria-label','Play');$('#again').hidden=false}
}
function frame(now){
  const dt=Math.min((now-last)/1000||0,.1);last=now;
  if(playing)t=Math.min(DUR,t+dt);
  render(t);ui();audioStep();
  requestAnimationFrame(frame);
}
{
  const m=location.hash.match(/t=([\d.]+)/);
  if(m){t=clamp(+m[1],0,DUR);started=true;$('#start').hidden=true;seek.disabled=false;evIdx=EV.findIndex(e=>e[0]>=t)}
}
resize();requestAnimationFrame(frame);
</script>
