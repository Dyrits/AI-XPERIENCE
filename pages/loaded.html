<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c1416">
<title>Loaded · A roguelike of dice</title>
<style>
:root{--chip:#1f8fff;--chipd:#0d5fb3;--mult:#ff4b42;--multd:#b3261e;--gold:#f7bc3c;--panel:#1a2528;--panel2:#233236;--line:#34494e;--ink:#f3efe4;--dim:#8ea6a9;--green:#2fb67c;--greend:#1f7d55;--orange:#f0902a;--oranged:#a85f12;--purple:#9a6fe0;--teal:#1fb0c8;--f:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0c1416;color:var(--ink);font-family:var(--f);font-weight:700;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#bg{position:fixed;inset:-2%;width:104%;height:104%;filter:blur(3px) saturate(1.15)}
#crt{position:fixed;inset:0;pointer-events:none;z-index:90;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.6))}
#wrap{position:fixed;left:50%;top:50%;width:1280px;height:720px;transform-origin:50% 50%}
#app{position:absolute;inset:0}
.panel{background:var(--panel);border-radius:12px;box-shadow:inset 0 0 0 2px var(--line),0 4px 0 rgba(0,0,0,.35)}
.lbl{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.money{color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.sh{text-shadow:0 3px 0 rgba(0,0,0,.35)}
/* side */
#side{position:absolute;left:14px;top:14px;width:262px;height:692px;display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:16px;background:rgba(14,22,24,.82);box-shadow:inset 0 0 0 2px #2b3c40,0 8px 30px rgba(0,0,0,.4)}
#blindBox{padding:0 0 10px;overflow:hidden;min-height:150px;--bc:#1e6fbf}
#blindName{background:var(--bc);padding:8px 10px;font-size:22px;text-align:center;letter-spacing:.03em;text-shadow:0 2px 0 rgba(0,0,0,.35);border-radius:12px 12px 0 0}
.brow{display:flex;gap:12px;align-items:center;padding:10px 12px 0}
.bchip{flex:none;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle,var(--bc) 0 46%,rgba(255,255,255,.9) 47% 52%,var(--bc) 53%);box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 0 0 4px rgba(0,0,0,.18);position:relative}
.bchip::after{content:'';position:absolute;inset:6px;border-radius:50%;border:3px dashed rgba(255,255,255,.55)}
.target{font-size:30px;color:var(--mult);text-shadow:0 3px 0 rgba(0,0,0,.35);line-height:1.05}
#bossDesc{margin:8px 12px 0;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.28);font-size:13px;text-align:center;color:#ffd9d9;display:none}
#scoreBox{display:flex;align-items:center;gap:10px;padding:10px 12px}
#roundScore{flex:1;text-align:center;font-size:32px;background:#0f1719;border-radius:8px;padding:4px 0}
#handBox{position:relative;padding:10px;isolation:isolate}
#handName{text-align:center;font-size:21px;min-height:30px;white-space:nowrap}
#handName small{font-size:14px;color:var(--dim);margin-left:6px}
.cm{display:flex;align-items:center;gap:6px;margin-top:6px}
.cm>div.box{flex:1;text-align:right;padding:6px 10px;border-radius:9px;font-size:30px;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s}
#chipsV{background:var(--chip)}#multV{background:var(--mult);text-align:left}
.cm .x{color:var(--mult);font-size:26px}
.bump{transform:scale(1.14)}
#handBox.fire::before{content:'';position:absolute;inset:-26px -4px 20px;z-index:-1;border-radius:20px;background:radial-gradient(ellipse at 25% 100%,#ffb03c 0,transparent 62%),radial-gradient(ellipse at 75% 100%,#ff3b2e 0,transparent 60%),radial-gradient(ellipse at 50% 100%,#ffe27a 0,transparent 45%);filter:blur(5px);animation:flame .16s infinite alternate}
@keyframes flame{from{transform:scaleY(1) translateY(0)}to{transform:scaleY(1.12) translateY(-4px)}}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{text-align:center;padding:6px 4px}
.stat .v{font-size:30px;line-height:1.1}
.stat .v small{font-size:15px;color:var(--dim)}
.stat.wide{grid-column:span 2;padding:4px}
#moneyV{font-size:38px}
.c{color:var(--chip)}.m{color:var(--mult)}
#sideBtns{display:flex;gap:8px;margin-top:auto}
#sideBtns .btn{flex:1;height:54px;font-size:16px}
/* buttons */
.btn{--b:var(--orange);--bd:var(--oranged);background:var(--b);box-shadow:0 5px 0 var(--bd);border-radius:10px;padding:8px 14px;font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);transition:transform .06s,filter .1s;line-height:1.1}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--bd)}
.btn[disabled]{--b:#4a5557;--bd:#2e3638;color:#9aa6a8;cursor:default;filter:none}
.btn.blue{--b:var(--chip);--bd:var(--chipd)}.btn.red{--b:var(--mult);--bd:var(--multd)}.btn.green{--b:var(--green);--bd:var(--greend)}
/* main */
#main{position:absolute;left:290px;top:14px;width:976px;height:692px}
#top{position:absolute;left:0;top:0;width:976px;height:150px;display:flex;gap:12px}
.area{position:relative;height:150px;border-radius:14px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 2px rgba(255,255,255,.06)}
#jokerArea{width:680px}#consArea{flex:1}
.count{position:absolute;left:12px;bottom:-20px;font-size:13px;color:var(--ink);opacity:.8}
#consArea .count{left:auto;right:12px}
.cardrow{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;gap:12px;padding:0 12px}
#stage{position:absolute;left:0;top:168px;width:976px;height:430px}
#table{position:absolute;inset:0;width:100%;height:100%;display:block}
#controls{position:absolute;left:0;top:606px;width:976px;height:86px;display:flex;align-items:center;justify-content:center;gap:24px}
#controls .btn{width:210px;height:64px;font-size:22px}
#controls .btn small{display:block;font-size:13px;opacity:.85}
#hint{width:330px;text-align:center;font-size:14px;color:#d7e2e3;text-shadow:0 2px 0 rgba(0,0,0,.4);line-height:1.35}
#hint kbd{font-family:var(--f);font-size:12px;padding:1px 6px;border-radius:4px;background:rgba(0,0,0,.35)}
#overlay{position:absolute;left:0;top:168px;width:976px;height:524px;display:none}
#overlay.on{display:block}
/* cards */
.card{position:relative;width:88px;height:120px;flex:none;cursor:pointer;animation:bob 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
.card .ci{position:absolute;inset:0;transform:perspective(420px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));transition:transform .12s}
.card canvas{width:88px;height:120px;border-radius:8px;display:block;box-shadow:0 5px 0 rgba(0,0,0,.4)}
.card .nm{position:absolute;left:3px;right:3px;bottom:6px;font-size:10.5px;text-align:center;line-height:1.05;text-shadow:0 1px 0 #000,0 0 4px #000;pointer-events:none}
.card.sel .ci{--ty:-12px}
.card.trig .ci{animation:trig .34s}
.card.drag{z-index:5;animation:none}
.card.drag .ci{transition:none}
.card.dead{opacity:.35;filter:grayscale(1)}
@keyframes bob{50%{translate:0 -3px}}
@keyframes trig{0%{scale:1;rotate:0deg}35%{scale:1.16;rotate:-7deg}70%{scale:1.05;rotate:5deg}100%{scale:1;rotate:0deg}}
.acts{position:absolute;left:50%;top:100%;transform:translate(-50%,-4px);display:flex;gap:4px;z-index:6}
.acts .btn{font-size:13px;padding:5px 9px;white-space:nowrap}
.pop{position:absolute;left:50%;top:100%;transform:translate(-50%,6px);padding:3px 9px;border-radius:7px;font-size:16px;white-space:nowrap;pointer-events:none;z-index:7;animation:popup .8s forwards;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.pop.chip{background:var(--chip)}.pop.mult,.pop.xmult{background:var(--mult)}.pop.money{background:var(--gold);color:#3a2600}.pop.info{background:var(--orange)}
@keyframes popup{0%{opacity:0;scale:.4}20%{opacity:1;scale:1.2}35%{scale:1}80%{opacity:1}100%{opacity:0;translate:0 -6px}}
/* tooltip */
#tip{position:absolute;z-index:40;min-width:180px;max-width:260px;padding:10px 12px;border-radius:12px;background:#f2eee4;color:#243033;box-shadow:0 0 0 3px #1a2528,0 8px 0 rgba(0,0,0,.4);font-size:14px;line-height:1.35;pointer-events:none;display:none;text-align:center}
#tip h4{font-size:18px;color:#1a2528;margin-bottom:5px}
#tip .tag{display:inline-block;margin-top:7px;padding:2px 10px;border-radius:6px;color:#fff;font-size:12px}
#tip .sub{font-size:12px;color:#6a7a7c;margin-top:5px}
.tc{color:#fff;background:var(--chip);padding:0 4px;border-radius:4px}
.tm{color:#fff;background:var(--mult);padding:0 4px;border-radius:4px}
.tx{color:#fff;background:#c21f3a;padding:0 4px;border-radius:4px}
.td{color:#7a5200;background:#ffe39a;padding:0 4px;border-radius:4px}
.th{color:#d8541e}
.r0{background:var(--chip)}.r1{background:var(--green)}.r2{background:var(--mult)}.rg{background:var(--purple)}.rs{background:var(--teal)}
/* dice net */
.net{display:grid;grid-template-columns:repeat(4,26px);grid-template-rows:repeat(3,26px);gap:3px;justify-content:center;margin:6px auto 0}
.mf{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:3px;border-radius:5px;background:#f3eee2;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.mf s,.mf u{display:block;text-decoration:none}
.mf s{border-radius:50%;background:#1d1b22;margin:1px}
.mf.one s{background:#c8282e}
.mf.up{outline:2px solid #ff9f1c;outline-offset:1px}
.mf.e-gold{background:linear-gradient(135deg,#ffd35a,#d99a1e)}.mf.e-gold s{background:#6a3f00}
.mf.e-glass{background:linear-gradient(135deg,#d6f0ff,#8cc4ee)}.mf.e-glass s{background:#fff;box-shadow:0 0 0 1px #6aa6d6}
.mf.e-bonus{background:#cfe6ff}.mf.e-bonus s{background:#1459c7}
.mf.e-mult{background:#ffd9d4}.mf.e-mult s{background:#c62828}
.mf.e-steel{background:linear-gradient(135deg,#d3d9e0,#7d8794)}.mf.e-steel s{background:#2a2f37}
.mf.e-wild{background:linear-gradient(135deg,#ff6b6b,#ffd166,#6ee7a8,#5ab0ff,#c08bff)}.mf.e-wild s{background:#1d1b22}
/* overlay panels */
.big{background:rgba(18,28,31,.94);border-radius:18px;box-shadow:inset 0 0 0 3px #364b50,0 10px 0 rgba(0,0,0,.35)}
.selRow{position:absolute;inset:14px 60px 20px;display:flex;gap:20px;justify-content:center;align-items:flex-end}
.bcol{--bc:#1e6fbf;width:240px;height:420px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 0 16px;overflow:hidden;transition:transform .2s,opacity .2s}
.bcol.next,.bcol.done{opacity:.55;transform:translateY(24px)}
.bcol .bh{width:100%;background:var(--bc);text-align:center;padding:12px 0;font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.bcol .bst{height:44px;display:flex;align-items:center;font-size:18px;color:var(--dim)}
.bcol .btn{height:44px;width:160px}
.bcol .bchip{width:84px;height:84px;margin:6px 0}
.bcol .bd{font-size:14px;text-align:center;color:#ffd9d9;padding:6px 10px;margin:0 12px;background:rgba(0,0,0,.3);border-radius:8px;min-height:40px}
.cash{position:absolute;left:50%;top:20px;width:520px;margin-left:-260px;padding:18px 22px}
.cash .btn{width:100%;height:58px;font-size:24px;margin-bottom:14px}
.cl{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:2px dashed rgba(255,255,255,.08);font-size:18px;opacity:0;transform:translateX(-10px);transition:all .2s}
.cl.in{opacity:1;transform:none}
.cl .money{font-size:22px}
.cl.total{border:0;font-size:22px}
.shop{position:absolute;left:20px;right:20px;top:4px;bottom:10px;padding:16px;display:flex;gap:18px}
.shop .col{width:190px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.shop .col .btn{height:88px;font-size:22px}
.shop .items{flex:1;display:flex;gap:26px;justify-content:center;align-items:center;border-radius:14px;background:rgba(0,0,0,.25);position:relative}
.shop .sign{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:26px;color:#ffdca0;letter-spacing:.08em}
.sItem{display:flex;flex-direction:column;align-items:center;gap:10px}
.price{font-size:20px;background:#2d3c40;border-radius:8px;padding:2px 12px}
.sItem .btn{font-size:15px;padding:6px 16px}
.sold{width:88px;height:120px;border-radius:8px;border:3px dashed rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.3);font-size:16px}
.dview{position:absolute;right:20px;bottom:14px;font-size:14px}
/* modal & screens */
#modal{position:absolute;inset:0;z-index:30;background:rgba(5,10,12,.7);display:none;align-items:center;justify-content:center}
#modal.on{display:flex}
#modal .big{padding:22px 26px;min-width:520px;max-width:1100px;max-height:660px;overflow:auto}
#modal h2{font-size:28px;text-align:center;margin-bottom:14px}
table.lv{border-collapse:separate;border-spacing:0 5px;font-size:15px}
table.lv td{padding:5px 10px;background:rgba(255,255,255,.05)}
table.lv td:first-child{border-radius:8px 0 0 8px}table.lv td:last-child{border-radius:0 8px 8px 0}
.lvb{display:inline-block;min-width:54px;text-align:center;border-radius:6px;background:#3a4c50;padding:1px 6px}
.nets{display:grid;grid-template-columns:repeat(3,auto);gap:14px 22px;align-content:start}
.nets .lbl{text-align:center}
.opt{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.opt .btn{height:50px}
.seg{display:flex;gap:6px}.seg .btn{flex:1}
#screen{position:absolute;inset:0;z-index:20;display:none;background:radial-gradient(ellipse at center,rgba(8,14,16,.45),rgba(6,10,12,.85));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);align-items:center;justify-content:center;flex-direction:column}
#screen.on{display:flex}
#logo{font-size:150px;letter-spacing:.02em;line-height:1;display:flex;gap:4px}
#logo span{display:inline-block;color:#fff;text-shadow:0 8px 0 #b3261e,0 14px 0 rgba(0,0,0,.35);animation:wob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.3s)}
#logo span:nth-child(odd){text-shadow:0 8px 0 #0d5fb3,0 14px 0 rgba(0,0,0,.35)}
@keyframes wob{50%{transform:translateY(-10px) rotate(-3deg)}}
.subt{font-size:22px;color:#ffe8c4;margin:24px 0 8px;letter-spacing:.2em;text-transform:uppercase}
#titleCv{width:640px;height:170px}
.tbtns{display:flex;gap:16px;margin-top:10px}
.tbtns .btn{width:200px;height:64px;font-size:26px}
.how{margin-top:22px;max-width:760px;text-align:center;font-size:15px;color:#cfdadb;line-height:1.5;background:rgba(0,0,0,.35);padding:12px 18px;border-radius:12px}
.end{padding:26px 34px;text-align:center;min-width:480px}
.end h1{font-size:56px;margin-bottom:10px}
.end .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 20px;text-align:left}
.end .grid div{display:flex;justify-content:space-between;gap:14px;background:rgba(255,255,255,.06);padding:8px 12px;border-radius:8px;font-size:16px}
.shake{animation:shk .25s}
@keyframes shk{20%{transform:translate(-5px,3px)}40%{transform:translate(4px,-4px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,3px)}}
</style>
</head>
<body>
<canvas id="bg" width="160" height="90"></canvas>
<div id="wrap"><div id="app">
  <aside id="side">
    <div id="blindBox" class="panel">
      <div id="blindName">Loaded</div>
      <div class="brow">
        <div class="bchip" id="blindChip"></div>
        <div>
          <div class="lbl">Score at least</div>
          <div class="target" id="blindTarget">-</div>
          <div class="lbl">Reward <span class="money" id="blindReward"></span></div>
        </div>
      </div>
      <div id="bossDesc"></div>
    </div>
    <div id="scoreBox" class="panel"><div class="lbl">Round<br>score</div><div id="roundScore" class="sh">0</div></div>
    <div id="handBox" class="panel">
      <div id="handName" class="sh">&nbsp;</div>
      <div class="cm"><div class="box sh" id="chipsV">0</div><div class="x">X</div><div class="box sh" id="multV">0</div></div>
    </div>
    <div id="stats">
      <div class="panel stat"><div class="lbl">Hands</div><div class="v c sh" id="handsV">-</div></div>
      <div class="panel stat"><div class="lbl">Rerolls</div><div class="v m sh" id="rerollsV">-</div></div>
      <div class="panel stat wide"><div class="money" id="moneyV">$0</div></div>
      <div class="panel stat"><div class="lbl">Ante</div><div class="v sh"><span id="anteV">1</span><small>/8</small></div></div>
      <div class="panel stat"><div class="lbl">Round</div><div class="v sh" id="roundV">1</div></div>
    </div>
    <div id="sideBtns"><button class="btn red" id="infoBtn">Run info</button><button class="btn" id="optBtn">Options</button></div>
  </aside>
  <main id="main">
    <div id="top">
      <div class="area" id="jokerArea"><div class="cardrow" id="jokers"></div><div class="count" id="jokerCount">0/5</div></div>
      <div class="area" id="consArea"><div class="cardrow" id="cons"></div><div class="count" id="consCount">0/2</div></div>
    </div>
    <div id="stage"><canvas id="table"></canvas></div>
    <div id="controls">
      <button class="btn blue" id="playBtn">Play hand<small id="playSub">&nbsp;</small></button>
      <div id="hint"></div>
      <button class="btn red" id="rerollBtn">Reroll<small id="rerollSub">&nbsp;</small></button>
    </div>
    <div id="overlay"></div>
  </main>
  <div id="tip"></div>
  <div id="modal"></div>
  <div id="screen"></div>
</div></div>
<div id="crt"></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const wrap = $('#wrap'), app = $('#app');
const PI = Math.PI, rnd = Math.random;
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const lerp = (a, b, t) => a + (b - a) * t;
let UID = 1;
const uid = () => UID++;
const fmt = n => { n = Math.floor(n); return n < 1e11 ? n.toLocaleString('en-US') : n.toExponential(3).replace('+', ''); };
const fx1 = n => (Math.round(n * 100) / 100).toString();
const fmtM = n => n % 1 && n < 1e6 ? n.toFixed(1) : fmt(n);

// Settings and best results persist between visits.
const STORE = 'loaded-dice-v1';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { saved = {}; }
const settings = Object.assign({ sound: true, music: true, speed: 1 }, saved.settings || {});
const best = Object.assign({ ante: 0, hand: 0, wins: 0, runs: 0 }, saved.best || {});
const persist = () => { try { localStorage.setItem(STORE, JSON.stringify({ settings, best })); } catch (e) {} };
const wait = ms => new Promise(r => setTimeout(r, ms / settings.speed));

// ---------------------------------------------------------------- content
const HANDS = [
  { id: 'high', name: 'High Die', chips: 5, mult: 1, lc: 10, lm: 1, star: 'Polaris' },
  { id: 'pair', name: 'Pair', chips: 10, mult: 2, lc: 15, lm: 1, star: 'Gemini' },
  { id: 'twopair', name: 'Two Pair', chips: 20, mult: 2, lc: 20, lm: 1, star: 'Albireo' },
  { id: 'three', name: 'Three of a Kind', chips: 30, mult: 3, lc: 20, lm: 2, star: "Orion's Belt" },
  { id: 'small', name: 'Small Straight', chips: 35, mult: 3, lc: 25, lm: 2, star: 'Lyra' },
  { id: 'full', name: 'Full House', chips: 40, mult: 4, lc: 25, lm: 2, star: 'Pleiades' },
  { id: 'large', name: 'Large Straight', chips: 50, mult: 5, lc: 30, lm: 3, star: 'Draco' },
  { id: 'four', name: 'Four of a Kind', chips: 60, mult: 7, lc: 30, lm: 3, star: 'Crux' },
  { id: 'five', name: 'Five of a Kind', chips: 120, mult: 12, lc: 35, lm: 3, star: 'Cassiopeia' },
];
const HAND = Object.fromEntries(HANDS.map((h, i) => [h.id, Object.assign(h, { rank: i })]));
const HANDDESC = {
  high: 'The single highest die scores', pair: 'Two dice of the same value', twopair: 'Two different pairs',
  three: 'Three dice of the same value', small: 'Four values in a row', full: 'Three of a kind plus a pair',
  large: 'Five values in a row', four: 'Four dice of the same value', five: 'Five dice of the same value',

function tone(f, dur, type = 'sine', vol = 0.15, when = 0, out = sfxG, f2 = 0) {

  o.connect(gn); gn.connect(out); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, type, freq, q = 1, when = 0, out = sfxG) {
  if (!AC) return;
  const t = (when || AC.currentTime) + 0.001, s = AC.createBufferSource(), f = AC.createBiquadFilter(), gn = AC.createGain();

// A slow lounge loop: Am9, Dm9, G9, Cmaj9, with bass and soft brushes.
let musNext = 0, musStep = 0;
const CHORDS = [[57, 60, 64, 67, 71], [50, 57, 60, 64, 65], [55, 59, 62, 65, 69], [48, 55, 59, 64, 67]];
const BASS = [[45, 0, 0, 52, 45, 0, 43, 0], [38, 0, 0, 45, 38, 0, 40, 0], [43, 0, 0, 50, 43, 0, 47, 0], [36, 0, 0, 43, 36, 0, 40, 0]];
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function musicTick() {
  if (!AC || !settings.music) return;
  const step = 60 / 84 / 2;
  if (musNext < AC.currentTime - 1) musNext = AC.currentTime + 0.05;
  while (musNext < AC.currentTime + 0.35) {
    const bar = Math.floor(musStep / 8) % 4, s = musStep % 8, t = musNext;
    if (s === 0) CHORDS[bar].forEach((n, i) => { tone(midi(n), 3.2, 'triangle', 0.018, t + i * 0.012, musG); tone(midi(n) * 1.003, 3.2, 'sine', 0.014, t, musG); });
    const b = BASS[bar][s]; if (b) tone(midi(b), 0.5, 'sine', 0.09, t, musG);
    if (s % 2 === 1) noise(0.06, 0.018, 'highpass', 6000, 0.7, t, musG);
    if (s === 5 && rnd() < 0.6) tone(midi(pick(CHORDS[bar]) + 12), 0.6, 'sine', 0.03, t, musG);
    musStep++; musNext += step;
  }
}
setInterval(musicTick, 100);

    else jokerPop(src.J, text, cls);

async function scoreHand() {
  const ev = evaluate(false);
  run.dice.forEach(d => { if (d.hidden) { d.hidden = false; d.pop = 1; } });
  await wait(ev.use.some(d => d.pop > 0) ? 350 : 60);
  const hid = ev.hand;
  const ctx = { hand: hid, present: ev.present, scoring: ev.scoring, total: ev.total, rerolls: blind.rerolls, last: blind.hands === 0, rerolled: blind.rerolled };
  if (bossId() === 'eye' && blind.played.has(hid)) {
    setHandBox(HAND[hid].name, run.levels[hid].lvl, 0, 0);
    floatText(SW / 2, 150, 'Already played!', '#ff7a70', 36); sfx.nope(); await wait(900);
    return 0;
  }
  blind.played.add(hid);
  run.levels[hid].played++;
  run.jokers.forEach(J => { const def = JDEF[J.id]; if (def.pre) def.pre(ctx, J); });
  const b = handBase(hid);
  sc = { chips: b.chips, mult: b.mult, pitch: 0 };
  setHandBox(HAND[hid].name, b.lvl, sc.chips, sc.mult);
  sfx.select();
  ev.scoring.forEach(d => { d.pop = 0.6; });
  await wait(420);
  const blank = bossId() === 'blank';
  for (let si = 0; si < ev.scoring.length; si++) {
    const die = ev.scoring[si], f = face(die);
    const dd = { v: ev.val.get(die), enh: blank ? null : f.enh, die };
    if (isDebuffed(f)) { const p = dieScreen(die); floatText(p.cx, p.cy - 62, 'Debuffed', '#b0b0b0', 24); sfx.nope(); await wait(300); continue; }
    const retr = [];
    run.jokers.forEach((J, i) => { const T = resolveJ(i); const def = T && JDEF[T.id]; if (def && def.retrig) { const n = def.retrig(ctx, T, dd, si) || 0; for (let k = 0; k < n; k++) retr.push(J); } });
    for (let r = 0; r <= retr.length; r++) {
      if (r > 0) { await applyFx({ info: 'Again!' }, { J: retr[r - 1] }); }
      die.pop = 1;
      await applyFx({ chips: dd.v }, { die });
      if (dd.enh === 'bonus') await applyFx({ chips: 25 }, { die });
      if (dd.enh === 'mult') await applyFx({ mult: 4 }, { die });
      if (dd.enh === 'glass') await applyFx({ xmult: 2 }, { die });
      if (dd.enh === 'gold') await applyFx({ money: 1 }, { die });
      for (let i = 0; i < run.jokers.length; i++) {
        const T = resolveJ(i), def = T && JDEF[T.id];
        if (def && def.die) await applyFx(def.die(ctx, T, dd), { J: run.jokers[i] });

    if (ev.scoring.includes(d)) continue;
    const f = face(d);
    if (f.enh === 'steel' && !isDebuffed(f)) { d.pop = 1; await applyFx({ xmult: 1.5 }, { die: d }); }
  }
  for (let i = 0; i < run.jokers.length; i++) {
    const T = resolveJ(i), def = T && JDEF[T.id];
    if (def && def.hand) await applyFx(def.hand(ctx, T), { J: run.jokers[i] });
  }
  const total = Math.floor(sc.chips * sc.mult);
  checkFire();
  await wait(200);
  $('#handName').innerHTML = `<span style="font-size:30px">${fmt(total)}</span>`;
  sfx.score();
  if (total >= blind.target) shakeApp();
  await wait(550);
  if (!blank) for (const d of ev.scoring) {
    const f = face(d);
    if (f.enh === 'glass' && !isDebuffed(f) && rnd() < 0.25) {
      f.enh = null; const p = dieScreen(d); burst(p.cx, p.cy, '#bfe6ff', 26, 300); floatText(p.cx, p.cy - 62, 'Shattered!', '#bfe6ff', 26); sfx.shatter(); await wait(350);
    }
  }
  if (bossId() === 'tide' && run.levels[hid].lvl > 1) { run.levels[hid].lvl--; floatText(SW / 2, 150, `${HAND[hid].name} level down`, '#7fd8e6', 28); }
  run.bestHand = Math.max(run.bestHand, total);
  if (total > best.hand) { best.hand = total; persist(); }
  return total;
}
async function tallyScore(total) {
  const from = blind.score, to = blind.score + total; blind.score = to;
  const steps = 18;
  for (let i = 1; i <= steps; i++) { blind.shown = Math.round(lerp(from, to, i / steps)); setText('roundScore', fmt(blind.shown)); if (i % 3 === 0) sfx.chip(i / 2); await wait(22); }
  blind.shown = to; renderSide();

}
async function playHand() {
  if (phase !== 'choose') return;
  phase = 'scoring'; blind.hands--;
  run.selJ = run.selC = null; renderJokers(); renderCons();
  run.dice.forEach(d => { d.sel = false; });
  renderSide(); renderControls();
  const total = await scoreHand();
  await tallyScore(total);
  if (blind.score >= blind.target) { await wait(250); return winBlind(); }
  if (blind.hands <= 0) { await wait(400); return gameOver(); }
  run.dice.forEach((d, i) => { if (!d.off) exitDie(d, i * 0.04); });
  sfx.whoosh();

}

async function winBlind() {

// ---------------------------------------------------------------- shop
function genItem(taken) {
  const r = rnd();
  if (r < 0.62) {
    const rr2 = rnd(), rar = rr2 < 0.07 ? 2 : rr2 < 0.35 ? 1 : 0;
    let pool = JOKERS.filter(j => j.r === rar && !run.jokers.some(J => J.id === j.id) && !taken.includes(j.id));
    if (!pool.length) pool = JOKERS.filter(j => !run.jokers.some(J => J.id === j.id) && !taken.includes(j.id));
    if (pool.length) { const j = pick(pool); return { kind: 'joker', id: j.id, cost: j.cost, s: Object.assign({}, j.init || {}) }; }
  }
  if (r < 0.82) { const G = pick(GLYPHS); return { kind: 'glyph', id: G.id, cost: 3 }; }
  const H = pick(HANDS); return { kind: 'star', id: H.id, cost: 3 };
}
function genShop() { const taken = [], items = []; for (let i = 0; i < 3; i++) { const it = genItem(taken); taken.push(it.id); items.push(it); } return items; }

    const w = document.createElement('div'); w.className = 'sItem';
    if (!it) { w.innerHTML = '<div class="price">&nbsp;</div><div class="sold">Sold</div><div style="height:31px"></div>'; box.appendChild(w); return; }
    w.innerHTML = `<div class="price money">$${it.cost}</div>`;
    const el = makeCard(it); w.appendChild(el);
    const full = it.kind === 'joker' ? run.jokers.length >= run.maxJ : it.kind === 'glyph' && run.cons.length >= run.maxC;
    const b = document.createElement('button'); b.className = 'btn' + (it.kind === 'joker' ? '' : ' blue');
    b.textContent = full ? 'No room' : it.kind === 'star' ? 'Buy & use' : 'Buy'; b.disabled = full || run.money < it.cost;
    b.onclick = () => buy(i);

}
function buy(i) {
  const it = shop.items[i]; if (!it || run.money < it.cost) return;
  if (it.kind === 'joker') { if (run.jokers.length >= run.maxJ) return; addJoker(it.id); }
  else if (it.kind === 'glyph') { if (run.cons.length >= run.maxC) return; run.cons.push({ kind: it.kind, id: it.id, uid: uid() }); }
  run.money -= it.cost; shop.items[i] = null; sfx.coin(); hideTip();

// Stars apply as soon as they are acquired and never take a consumable slot.
function applyStar(id) {
  const L = run.levels[id]; L.lvl++; run.starsUsed++; sfx.level();
  const b = handBase(id);
  setHandBox(HAND[id].name, L.lvl, b.chips, b.mult); bump('chipsV'); bump('multV');
  if (phase === 'choose') floatText(SW / 2, 120, `${HAND[id].name} level ${L.lvl}`, '#7fe0f0', 32);

function canUse(Cn) {

  if (Cn.kind === 'star') return true;
  const G = GDEF[Cn.id];
  if (!G.max) return true;
  if (phase !== 'choose') return false;
  const n = run.dice.filter(d => d.sel && !d.off).length;

}
async function useCons(Cn) {

    else sel.forEach(d => { const f = face(d); if (G.enh) f.enh = G.enh; else if (G.id === 'nudge') f.v = Math.min(6, f.v + 1); else if (G.id === 'sink') f.v = Math.max(1, f.v - 1); });
    const targets = G.id === 'twinG' ? [sel[0]] : sel;
    targets.forEach(d => { d.pop = 1; d.sel = false; const p = dieScreen(d); burst(p.cx, p.cy, '#d9c2ff', 22, 240); });
    sel.forEach(d => { d.sel = false; });

  }

}

  if (d) { toggleDie(d); }
  else if (run && (run.selJ || run.selC)) { run.selJ = run.selC = null; renderJokers(); renderCons(); renderControls(); }
});
$('#playBtn').onclick = () => playHand();
$('#rerollBtn').onclick = () => doReroll();
$('#infoBtn').onclick = () => { sfx.select(); openInfo(); };
$('#optBtn').onclick = () => { sfx.select(); openOptions(); };
addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { closeModal(); return; }
  if (modal.classList.contains('on') || !run) return;
  if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); playHand(); }
  else if (ev.key === 'r' || ev.key === 'R') doReroll();
  else if (/^[1-6]$/.test(ev.key)) { const d = run.dice[+ev.key - 1]; if (d) toggleDie(d); }
});
addEventListener('pointerdown', () => ensureAudio(), { once: true });

// ---------------------------------------------------------------- loop
function resize() {
  SCALE = Math.min(innerWidth / 1280, innerHeight / 720);
  wrap.style.transform = `translate(-50%,-50%) scale(${SCALE})`;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(SW * SCALE * DPR)); cv.height = Math.max(1, Math.round(SH * SCALE * DPR));
  K = cv.width / SW;
  const bw = 160, bh = Math.max(40, Math.round(160 * innerHeight / Math.max(1, innerWidth)));
  if (bgc.height !== bh) { bgc.width = bw; bgc.height = bh; bgImg = bgx.createImageData(bw, bh); }
  buildFelt();
}
addEventListener('resize', resize);
let last = performance.now(), T = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  drawBg(T);
  updateDice(dt * settings.speed);
  drawTable(dt);
  if (phase === 'title') drawTitle(T);
  requestAnimationFrame(frame);
}
resize();
renderEmpty();
showTitle();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
