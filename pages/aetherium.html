<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AETHERIUM — Kinetic Fluid Astrolabe</title>
  <style>
    :root {
      --bg: #040508;
      --glass: rgba(9, 12, 20, 0.56);
      --glass-hover: rgba(20, 26, 42, 0.72);
      --border: rgba(255, 255, 255, 0.11);
      --border-strong: rgba(255, 255, 255, 0.22);
      --text: rgba(244, 246, 252, 0.92);
      --text-muted: rgba(210, 220, 240, 0.56);
      --accent: #ebd2a4;
      --accent-glow: rgba(235, 210, 164, 0.35);
      --cyan: #7be8ff;
      --font-display: "Didot", "Bodoni MT", "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif;
      --font-mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Monaco, monospace;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* Stage layers */
    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #0b0f1b 0%, #040508 72%);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #fluid-canvas {
      z-index: 1;
    }

    #overlay-canvas {
      z-index: 2;
      pointer-events: auto;
      cursor: crosshair;
    }

    #overlay-canvas.grab {
      cursor: grab;
    }

    #overlay-canvas.grabbing {
      cursor: grabbing;
    }

    /* Subtle atmospheric glass frame */
    .vignette-frame {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      box-shadow: inset 0 0 120px rgba(2, 3, 7, 0.72);
    }

    /* Intro Choreography Overlay */
    .intro-veil {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      transition: opacity 1.4s var(--ease-out-expo), transform 1.4s var(--ease-out-expo);
    }

    .intro-veil.hidden {
      opacity: 0;
      transform: translateY(-22px) scale(1.03);
    }

    .intro-title {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(2.4rem, 7vw, 5.2rem);
      letter-spacing: 0.42em;
      padding-left: 0.42em;
      color: rgba(255, 250, 240, 0.96);
      text-shadow:
        0 0 38px rgba(235, 210, 164, 0.35),
        0 0 80px rgba(123, 232, 255, 0.18);
      animation: introTitleReveal 2.2s var(--ease-out-expo) both;
    }

    .intro-rule {
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(235, 210, 164, 0.7), transparent);
      animation: introRuleReveal 1.8s 0.25s var(--ease-out-expo) both;
    }

    .intro-sub {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.36em;
      padding-left: 0.36em;
      text-transform: uppercase;
      color: rgba(235, 210, 164, 0.78);
      animation: introSubReveal 1.8s 0.4s var(--ease-out-expo) both;
    }

    @keyframes introTitleReveal {
      0% {
        opacity: 0;
        letter-spacing: 0.64em;
        filter: blur(10px);
        transform: translateY(12px);
      }
      100% {
        opacity: 1;
        letter-spacing: 0.42em;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    @keyframes introRuleReveal {
      0% {
        opacity: 0;
        transform: scaleX(0);
      }
      100% {
        opacity: 1;
        transform: scaleX(1);
      }
    }

    @keyframes introSubReveal {
      0% {
        opacity: 0;
        transform: translateY(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* HUD Container */
    .hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.6s var(--ease-out-expo);
    }

    body.zen-mode .hud {
      opacity: 0;
    }

    body.zen-mode .hud * {
      pointer-events: none !important;
    }

    /* Top Bar */
    .top-bar {
      position: absolute;
      top: 22px;
      left: 26px;
      right: 26px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 1s var(--ease-out-expo), transform 1s var(--ease-out-expo);
    }

    .brand.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .brand-name {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 1.18rem;
      letter-spacing: 0.28em;
      color: rgba(255, 250, 240, 0.94);
    }

    .brand-sigil {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.85;
      animation: slowSpin 28s linear infinite;
    }

    @keyframes slowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .brand-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding-left: 28px;
    }

    .brand-realm {
      color: var(--accent);
      transition: color 0.4s ease;
    }

    /* Top-right telemetry & quick buttons */
    .top-actions {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .telemetry-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .flux-wave {
      width: 34px;
      height: 16px;
      display: block;
    }

    .telemetry-val {
      color: var(--text);
      min-width: 34px;
      text-align: right;
    }

    .telemetry-sep {
      width: 1px;
      height: 12px;
      background: var(--border);
    }

    .icon-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      min-width: 36px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--glass);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09);
      transition: background 0.22s ease, border-color 0.22s ease, transform 0.18s var(--ease-out-expo), color 0.22s ease, box-shadow 0.25s ease;
    }

    .icon-btn:hover {
      background: var(--glass-hover);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .icon-btn.active {
      border-color: rgba(235, 210, 164, 0.52);
      color: var(--accent);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        0 0 18px rgba(235, 210, 164, 0.18);
    }

    .icon-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Audio icon + equalizer micro animation */
    .audio-icon-muted {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .eq-bars {
      display: none;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
      width: 14px;
      justify-content: center;
    }

    .icon-btn.active .audio-icon-muted {
      display: none;
    }

    .icon-btn.active .eq-bars {
      display: inline-flex;
    }

    .eq-bars span {
      display: block;
      width: 2px;
      height: 4px;
      border-radius: 2px;
      background: currentColor;
    }

    .icon-btn.active .eq-bars span:nth-child(1) { animation: eqBounce 0.72s ease-in-out infinite alternate; }
    .icon-btn.active .eq-bars span:nth-child(2) { animation: eqBounce 0.54s 0.15s ease-in-out infinite alternate; }
    .icon-btn.active .eq-bars span:nth-child(3) { animation: eqBounce 0.85s 0.05s ease-in-out infinite alternate; }
    .icon-btn.active .eq-bars span:nth-child(4) { animation: eqBounce 0.62s 0.22s ease-in-out infinite alternate; }

    @keyframes eqBounce {
      0% { height: 3px; }
      100% { height: 12px; }
    }

    /* Tooltip on hover */
    [data-tip] {
      position: relative;
    }

    [data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      padding: 5px 9px;
      border-radius: 7px;
      background: rgba(8, 10, 18, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: rgba(244, 246, 252, 0.92);
      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 0.06em;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease, transform 0.18s var(--ease-out-expo);
      z-index: 30;
    }

    .top-actions [data-tip]::after {
      bottom: auto;
      top: calc(100% + 10px);
      transform: translateX(-50%) translateY(-4px);
    }

    [data-tip]:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Bottom Dock */
    .dock-wrap {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: calc(100vw - 24px);
    }

    .hint-pill {
      pointer-events: none;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(8, 11, 20, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.09em;
      color: rgba(226, 232, 246, 0.72);
      transition: opacity 0.8s ease, transform 0.8s var(--ease-out-expo);
      white-space: nowrap;
    }

    .hint-pill.faded {
      opacity: 0;
      transform: translateY(6px);
    }

    .dock {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(22px) saturate(165%);
      -webkit-backdrop-filter: blur(22px) saturate(165%);
      box-shadow:
        0 18px 48px rgba(0, 0, 0, 0.52),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      overflow-x: auto;
      scrollbar-width: none;
      max-width: 100%;
    }

    .dock::-webkit-scrollbar {
      display: none;
    }

    .dock-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .dock-divider {
      width: 1px;
      height: 22px;
      background: var(--border);
      margin: 0 4px;
      flex-shrink: 0;
    }

    .tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 0.76rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.22s var(--ease-out-expo);
    }

    .tool-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .tool-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .tool-btn.active {
      color: #fff8eb;
      background: rgba(235, 210, 164, 0.16);
      border-color: rgba(235, 210, 164, 0.42);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 0 16px rgba(235, 210, 164, 0.16);
    }

    .tool-btn.compact {
      padding: 0 10px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
    }

    /* Palette Orbs */
    .realm-orb {
      position: relative;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      cursor: pointer;
      padding: 0;
      transition: transform 0.24s var(--ease-out-expo), border-color 0.24s ease, box-shadow 0.24s ease;
      flex-shrink: 0;
    }

    .realm-orb:hover {
      transform: scale(1.16);
      border-color: rgba(255, 255, 255, 0.65);
    }

    .realm-orb.active {
      transform: scale(1.14);
      border-color: #fff;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.14), 0 0 16px var(--orb-glow);
    }

    .realm-orb[data-realm="opaline"] {
      background: conic-gradient(from 40deg, #2d3e8f, #7be8ff, #f1d3a2, #9b6dff, #2d3e8f);
      --orb-glow: rgba(123, 232, 255, 0.5);
    }

    .realm-orb[data-realm="solaris"] {
      background: conic-gradient(from 40deg, #ff4522, #ffae34, #fff0b8, #9c27b0, #ff4522);
      --orb-glow: rgba(255, 162, 56, 0.55);
    }

    .realm-orb[data-realm="abyssal"] {
      background: conic-gradient(from 40deg, #0b2266, #00f5d4, #4895ef, #ff4d8d, #0b2266);
      --orb-glow: rgba(0, 245, 212, 0.5);
    }

    .realm-orb[data-realm="chromatic"] {
      background: conic-gradient(from 0deg, #ff5f6d, #ffc371, #38ef7d, #4facfe, #c471ed, #ff5f6d);
      --orb-glow: rgba(196, 113, 237, 0.55);
    }

    /* Zen Restore Pill */
    .zen-restore {
      position: fixed;
      top: 20px;
      right: 22px;
      z-index: 15;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    body.zen-mode .zen-restore {
      opacity: 0.42;
      pointer-events: auto;
    }

    body.zen-mode .zen-restore:hover {
      opacity: 1;
    }

    /* Status Toast */
    .toast {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      z-index: 25;
      pointer-events: none;
      padding: 7px 16px;
      border-radius: 999px;
      background: rgba(10, 14, 24, 0.76);
      border: 1px solid rgba(235, 210, 164, 0.3);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.35s var(--ease-out-expo);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Responsive adjustments */
    @media (max-width: 780px) {
      .top-bar {
        top: 14px;
        left: 14px;
        right: 14px;
      }

      .telemetry-pill {
        display: none;
      }

      .brand-name {
        font-size: 0.98rem;
        letter-spacing: 0.22em;
      }

      .brand-meta {
        padding-left: 26px;
        font-size: 0.58rem;
        white-space: nowrap;
      }

      .brand-meta-extra {
        display: none;
      }

      .dock {
        gap: 3px;
        padding: 5px 8px;
      }

      .dock-group {
        gap: 2px;
      }

      .dock-divider {
        margin: 0 2px;
        height: 18px;
      }

      .tool-btn span.label {
        display: none;
      }

      .tool-btn {
        height: 30px;
        padding: 0 7px;
      }

      .tool-btn.compact {
        padding: 0 7px;
      }

      .realm-orb {
        width: 20px;
        height: 20px;
      }

      .hint-pill {
        font-size: 0.58rem;
        max-width: calc(100vw - 28px);
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .dock-wrap {
        bottom: 14px;
      }
    }

    @media (max-width: 460px) {
      .dock {
        gap: 2px;
        padding: 4px 6px;
      }

      .tool-btn, .tool-btn.compact {
        height: 28px;
        padding: 0 5px;
        font-size: 0.64rem;
      }

      .realm-orb {
        width: 18px;
        height: 18px;
      }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="fluid-canvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
    <div class="vignette-frame"></div>
  </div>

  <!-- Opening Choreography Title -->
  <div class="intro-veil" id="intro-veil" aria-hidden="true">
    <div class="intro-title">AETHERIUM</div>
    <div class="intro-rule"></div>
    <div class="intro-sub">Kinetic Fluid Astrolabe</div>
  </div>

  <!-- Transient status toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Zen mode restore button -->
  <button class="icon-btn zen-restore" id="zen-restore-btn" title="Show interface (H)">
    <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
    <span>HUD</span>
  </button>

  <!-- Main HUD -->
  <div class="hud" id="hud">
    <header class="top-bar">
      <div class="brand" id="brand">
        <div class="brand-name">
          <svg class="brand-sigil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <circle cx="12" cy="12" r="9.5" stroke-opacity="0.55" stroke-dasharray="3 2.5"/>
            <circle cx="12" cy="12" r="5" stroke-opacity="0.9"/>
            <line x1="12" y1="1" x2="12" y2="5" stroke-opacity="0.8"/>
            <line x1="12" y1="19" x2="12" y2="23" stroke-opacity="0.8"/>
            <line x1="1" y1="12" x2="5" y2="12" stroke-opacity="0.8"/>
            <line x1="19" y1="12" x2="23" y2="12" stroke-opacity="0.8"/>
            <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
          </svg>
          <span>AETHERIUM</span>
        </div>
        <div class="brand-meta">
          <span class="brand-realm" id="realm-label">OPALINE</span>
          <span class="brand-meta-extra">·</span>
          <span class="brand-meta-extra" id="engine-label">WEBGL2 FLUID</span>
        </div>
      </div>

      <div class="top-actions">
        <div class="telemetry-pill" aria-label="Kinetic telemetry">
          <svg class="flux-wave" id="flux-wave" viewBox="0 0 34 16">
            <path id="flux-path" d="M 0 8 L 34 8" fill="none" stroke="rgba(235,210,164,0.85)" stroke-width="1.35" stroke-linecap="round"/>
          </svg>
          <span>FLUX</span>
          <span class="telemetry-val" id="flux-val">0.00</span>
          <span class="telemetry-sep"></span>
          <span>NODES</span>
          <span class="telemetry-val" id="nodes-val">3</span>
        </div>

        <button class="icon-btn" id="audio-btn" data-tip="Harmonic Synth (S)" aria-label="Toggle Harmonic Audio">
          <span class="audio-icon-muted" aria-hidden="true">
            <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7" stroke-opacity="0.75"/><path d="M18.8 5.8a9 9 0 0 1 0 12.4" stroke-opacity="0.4"/></svg>
          </span>
          <span class="eq-bars" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </span>
        </button>

        <button class="icon-btn" id="pause-btn" data-tip="Pause / Resume (P)" aria-label="Pause or Resume">
          <svg id="pause-icon" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>

        <button class="icon-btn" id="snap-btn" data-tip="Capture PNG" aria-label="Capture Snapshot">

  (() => {

    /* =========================================================================

    /* =========================================================================
       2. GLOBAL STATE
       ========================================================================= */
    const state = {

      tool: 'flow',         // 'flow' | 'vortex' | 'prism' | 'attractor'
