const ico = name => `<svg class="ico" viewBox="0 0 18 18" aria-hidden="true">${I[name]}</svg>`;

const TOOLS = [
  ['select', 'V', 'Select'],
  ['pen', 'P', 'Pen'],
  ['marker', 'H', 'Highlighter'],
  ['eraser', 'E', 'Eraser'],
  ['rect', 'R', 'Rectangle'],
  ['ellipse', 'O', 'Ellipse'],
  ['diamond', 'D', 'Diamond'],
  ['triangle', 'G', 'Triangle'],
  ['line', 'L', 'Line'],
  ['arrow', 'A', 'Arrow'],
  ['text', 'T', 'Text'],
  ['note', 'N', 'Sticky note'],
  ['hand', 'S', 'Pan'],
];

function buildUI() {
  const rail = $('#rail');
  let html = '', prev = null;
  for (const [id, key, label] of TOOLS) {
    if (prev && (prev === 'select' || id === 'line' || id === 'text' || id === 'rect')) html += '<span class="vsep"></span>';
    html += `<button class="tool" type="button" data-tool="${id}" title="${label} (${key})" aria-label="${label}">${ico(id)}<span class="k">${key}</span></button>`;
    prev = id;
  }
  rail.innerHTML = html;
  on(rail, 'click', e => {
    const b = e.target.closest('.tool');
    if (b) setTool(b.dataset.tool);
  });

  const style = $('#style');
  style.innerHTML =
    `<div class="swatches">${INKS.map((c, i) => `<button class="sw" type="button" data-ink="${i}" title="${c.n}" style="background:${c.c}"></button>`).join('')}</div>` +
    `<span class="vsep"></span>` +
    `<div class="weights">${WEIGHTS.map((w, i) => `<button class="wt" type="button" data-w="${i}" title="Stroke weight"><i style="width:${4 + i * 3}px;height:${4 + i * 3}px"></i></button>`).join('')}</div>` +
    `<span class="vsep"></span>` +
    `<div class="fills">` +
    `<button class="fl none" type="button" data-fill="none" title="No fill"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>` +
    `<button class="fl" type="button" data-fill="tint" title="Pale fill"></button>` +
    `<button class="fl" type="button" data-fill="solid" title="Tint of the ink"></button>` +
    `</div>`;
  on(style, 'click', e => {
    const sw = e.target.closest('[data-ink]'), wt = e.target.closest('[data-w]'), fl = e.target.closest('[data-fill]');
    if (sw) setInk(+sw.dataset.ink);
    else if (wt) { S.weight = +wt.dataset.w; syncStyle(); mark(); }
    else if (fl) { S.fill = fl.dataset.fill; syncStyle(); mark(); }
  });

  const top = $('#topright');
  top.innerHTML =
    tb('undo', 'Undo (⌘Z)', 'undo') + tb('redo', 'Redo (⇧⌘Z)', 'redo') +
    '<span class="sep"></span>' +
    tb('layers', 'Show the first draft', 'draft') + tb('mute', 'Pen sound', 'sound') +
    '<span class="sep"></span>' +
    tb('png', 'Save as PNG', 'png') + tb('file', 'Open a saved board', 'open') +
    '<span class="sep"></span>' +
    tb('trash', 'Clear the board', 'clear') + tb('help', 'Shortcuts (?)', 'help');
  on(top, 'click', e => {
    const b = e.target.closest('.tb');
    if (b && !b.disabled) CHROME[b.dataset.act]?.();
  });

  const align = $('#align');
  const acts = [['aL', 'l'], ['aC', 'h'], ['aR', 'r'], ['aT', 't'], ['aM', 'v'], ['aB', 'b'], ['dH', 'dh'], ['dV', 'dv']];
  align.innerHTML = acts.map(([i, k]) => `<button class="tb sm" type="button" data-al="${k}" title="Align">${ico(i)}</button>`).join('');
  on(align, 'click', e => {
    const b = e.target.closest('[data-al]');
    if (b) alignSel(b.dataset.al);
  });

  const zoom = $('#zoom');
  zoom.innerHTML = tb('minus', 'Zoom out (−)', 'out') + '<span class="lvl mono">100%</span>' +
    tb('plus', 'Zoom in (+)', 'in') + tb('fit', 'Zoom to fit (0)', 'fit');
  on(zoom, 'click', e => {
    const b = e.target.closest('.tb');
    if (b) ({ out: () => zoomBy(1 / 1.2), in: () => zoomBy(1.2), fit: () => fitView() })[b.dataset.act]?.();
    else if (e.target.closest('.lvl')) fitView();
  });

  const tr = $('#timeline .transport');
  tr.innerHTML = `<button class="tb" type="button" data-t="start" title="Back to the first mark">${ico('rewind')}</button>` +
    `<button class="tb" type="button" data-t="play" title="Play the session (Enter)">${ico('play')}</button>` +
    `<button class="tb" type="button" data-t="now" title="Return to the present">${ico('live')}</button>`;
  on(tr, 'click', e => {
    const b = e.target.closest('[data-t]');
    if (!b) return;
    ({ start: () => scrubTo(S.t0), play: togglePlay, now: toNow }[b.dataset.t])();
  });

  const track = $('#timeline .track');
  let scrubbing = false;
  const at = e => { const r = track.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width, 0, 1); };
  on(track, 'pointerdown', e => { scrubbing = true; track.setPointerCapture?.(e.pointerId); S.playing = false; scrubTo(S.t0 + at(e) * (S.t1 - S.t0)); });
  on(track, 'pointermove', e => { if (scrubbing) scrubTo(S.t0 + at(e) * (S.t1 - S.t0)); });
  on(window, 'pointerup', () => { scrubbing = false; });

  on($('#past button'), 'click', toNow);
  syncStyle(); syncZoomUI(); updateHistoryUI(); updatePastUI();
}
const tb = (name, title, act) =>
  `<button class="tb" type="button" data-act="${act}" title="${title}" aria-label="${title}">${ico(name)}</button>`;

const CHROME = {
  undo, redo,
  draft: () => {
    S.ghosts = !S.ghosts;
    syncStyle(); save(); mark();
    toast(S.ghosts ? 'First draft shown' : 'First draft hidden');
  },
  sound: () => { S.sound = !S.sound; syncStyle(); S.sound ? (audio(), tick(520, .05, .09)) : penOff(); },
  png: exportPNG,
  open: importJSON,
  clear: clearBoard,
  help: () => toggleSheet('help'),
};

function setTool(id) {
  S.tool = id;
  document.querySelectorAll('.tool').forEach(b => b.classList.toggle('on', b.dataset.tool === id));
  $('#style').classList.toggle('filling', ['rect', 'ellipse', 'diamond', 'triangle'].includes(id));
  board.style.cursor = id === 'hand' ? 'grab' : id === 'select' ? 'default' : 'crosshair';
  syncStack();
  mark();
}
function setInk(i) {
  S.ink = clamp(i, 0, INKS.length - 1);
  syncStyle(); mark();
}
function syncStyle() {
  document.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', +b.dataset.ink === S.ink));
  document.querySelectorAll('.wt').forEach(b => b.classList.toggle('on', +b.dataset.w === S.weight));
  document.querySelectorAll('.fl').forEach(b => {
    b.classList.toggle('on', b.dataset.fill === S.fill);
    if (b.dataset.fill === 'tint') b.style.background = INKS[S.ink].f;
    if (b.dataset.fill === 'solid') b.style.background = INKS[S.ink].c + '40';
  });
  document.querySelectorAll('#topright .tb').forEach(b => {
    if (b.dataset.act === 'sound') b.querySelector('.ico').innerHTML = S.sound ? I.sound : I.mute;
    if (b.dataset.act === 'draft') b.classList.toggle('on', S.ghosts);
  });
  syncStack();
}
function syncZoomUI() { $('#zoom .lvl').textContent = Math.round(S.cam.s * 100) + '%'; }

/* The bars stack upward from the tool rail, which wraps on narrow screens, so
   their heights are measured rather than guessed. */
function syncStack() {
  const cs = document.documentElement.style;
  cs.setProperty('--rail-h', $('#rail').offsetHeight + 'px');
  cs.setProperty('--style-h', $('#style').offsetHeight + 'px');
}
function updateHistoryUI() {
  $('#topright [data-act="undo"]').disabled = !undoStack.length;
  $('#topright [data-act="redo"]').disabled = !redoStack.length;
}
function hideHint() { $('#hint').classList.add('gone'); }

function alignSel(kind) {
  const list = S.els.filter(e => S.sel.has(e.eid) && isResizable(e));
  if (list.length < 2) return;
  pushHistory();
  const b = unionBounds(list);
  if (kind === 'dh' || kind === 'dv') {
    const horiz = kind === 'dh';
    list.sort((a, c) => (horiz ? elBounds(a).x - elBounds(c).x : elBounds(a).y - elBounds(c).y));
    const first = elBounds(list[0]), last = elBounds(list[list.length - 1]);
    const total = (horiz ? last.x + last.w - first.x : last.y + last.h - first.y);
    let cur = horiz ? first.x : first.y;
    for (const el of list) {
      const eb = elBounds(el);
      const d = horiz ? cur - eb.x : cur - eb.y;
      translateEl(el, horiz ? d : 0, horiz ? 0 : d);
      cur += (horiz ? eb.w : eb.h) + total / (list.length - 1);
    }
  } else {
    for (const el of list) {
      const eb = elBounds(el);
      if (kind === 'l') el.x = b.x;
      if (kind === 'r') el.x = b.x + b.w - eb.w;
      if (kind === 'h') el.x = b.x + (b.w - eb.w) / 2;
      if (kind === 't') el.y = b.y;
      if (kind === 'b') el.y = b.y + b.h - eb.h;
      if (kind === 'v') el.y = b.y + (b.h - eb.h) / 2;
      if (el.k === 'text') el.lines = null;
    }
  }
  syncDoc(); mark();
}

/* --------------------------------- reel -----------------------------------
   The strip along the bottom is not a scrollbar. It is a density plot of
   every mark you have made, plotted against the moment it was made, with the
   played part of the session filled in red.
   ------------------------------------------------------------------------- */

const reel = $('#reel'), rctx = reel.getContext('2d'), headEl = $('#head'), trackEl = $('#timeline .track');
const playT = () => (S.ph === Infinity ? S.t1 : S.ph);

function fmt(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}
function scrubTo(t) {
  if (!S.els.length) return;
  S.ph = t >= S.t1 - 1 ? Infinity : t;
  S.playing = false;
  updatePastUI(); mark();
}
function toNow() { S.ph = Infinity; S.playing = false; updatePastUI(); mark(); }
function togglePlay() {
  if (!S.els.length) return toast('Draw something first');
  if (S.playing) { S.playing = false; updatePastUI(); return; }
  if (S.ph === Infinity || S.ph >= S.t1) S.ph = S.t0;
  S.playing = true; updatePastUI(); mark();
}
function updatePastUI() {
  const past = S.ph !== Infinity;
  const p = $('#past');
  p.classList.toggle('on', past);
  $('#past .lbl').textContent = past ? `in the past · ${fmt(S.t1 - S.ph)} ago` : '';
  const play = $('#timeline [data-t="play"] .ico');
  if (play) play.innerHTML = S.playing ? I.pause : I.play;
}

const clockEl = $('#timeline .clock');
let trackW = 0, trackH = 0;

function drawReel() {
  const dpr = S.dpr;
  const w = trackEl.clientWidth, h = trackEl.clientHeight;
  if (!w || !h) return;
  if (w !== trackW || h !== trackH) {
    trackW = w; trackH = h;
    reel.width = Math.round(w * dpr); reel.height = Math.round(h * dpr);
  }
  rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  rctx.clearRect(0, 0, w, h);

  const span = Math.max(1, S.t1 - S.t0);
  const B = clamp(Math.round(w / 2), 40, 320);
  const buckets = new Float32Array(B);
  if (S.els.length && S.t1 > S.t0) {
    for (const el of S.els) {
      const i = clamp(Math.floor((el.t - S.t0) / span * B), 0, B - 1);
      if (el.k === 'stroke') for (const p of el.pts) buckets[clamp(Math.floor((p.t - S.t0) / span * B), 0, B - 1)] += 1;
      else {
        buckets[i] += 2.5;
        const j = clamp(Math.floor(((el.end ?? el.t) - S.t0) / span * B), 0, B - 1);
        if (j !== i) buckets[j] += 1.5;
      }
    }
  }
  let max = .001;
  for (const v of buckets) if (v > max) max = v;

  const mid = h / 2, amp = h * .42;
  const headF = S.els.length ? clamp((playT() - S.t0) / span, 0, 1) : 1;
  rctx.fillStyle = 'rgba(247,244,236,.14)';
  rctx.fillRect(0, mid - .5, w, 1);

  if (!S.els.length) {
    headEl.style.left = '100%';
    headEl.style.opacity = '0';
  } else {
    headEl.style.opacity = '1';
    headEl.style.left = headF * 100 + '%';
    const bw = w / B;
    for (let i = 0; i < B; i++) {
      const v = Math.sqrt(buckets[i] / max) * amp;
      if (v < .4) continue;
      const x = i * bw;
      rctx.fillStyle = (i / B) <= headF ? 'rgba(200,64,47,.85)' : 'rgba(247,244,236,.2)';
      rctx.fillRect(x, mid - v, Math.max(.8, bw - .6), v * 2);
    }
  }

  const marks = S.els.length;
  clockEl.innerHTML = marks
    ? `<b>${marks}</b> mark${marks === 1 ? '' : 's'} <span style="opacity:.4">·</span> ${fmt(S.t1 - S.t0)}`
    : `<span style="opacity:.55">an empty sheet</span>`;
}

/* ------------------------------ persistence ------------------------------- */

const KEY = 'palimpsest.board.v1', SEEN = 'palimpsest.seen.v1';
let saveTimer = 0;

function save() {
  if (!S.els.length) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify({ els: S.els, ghosts: S.ghosts })); } catch (_) { /* private mode */ }
  }, 600);
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!Array.isArray(d.els) || !d.els.length) return false;
    S.els = d.els;
    S.ghosts = d.ghosts !== false;
    for (const el of S.els) { el.lines = null; el.pts?.forEach(p => (p.p ??= 1)); }
    return true;
  } catch (_) { return false; }
}

function syncDoc() {
  let t0 = Infinity, t1 = -Infinity, mx = 0;
  for (const el of S.els) {
    // A stroke spans from its first point to its last, so the reel can be
    // scrubbed into the middle of a single mark as well as between marks.
    let a = el.t, z = el.end ?? el.t;
    if (el.k === 'stroke' && el.pts.length) { a = el.pts[0].t; z = el.pts[el.pts.length - 1].t; }
    if (a < t0) t0 = a;
    if (z > t1) t1 = z;
    if (el.eid > mx) mx = el.eid;
  }
  if (!S.els.length) { t0 = 0; t1 = 0; }
  S.t0 = t0; S.t1 = t1;
  uid = Math.max(uid, mx);
  if (S.ph !== Infinity && (S.ph > t1 || !S.els.length)) S.ph = Infinity;
  save(); drawReel(); updatePastUI(); syncInspector();
}

function syncInspector() {
  const sel = S.els.filter(e => S.sel.has(e.eid));
  $('#align').classList.toggle('on', sel.filter(isResizable).length >= 2);
  if (sel.length === 1) {
    const i = INKS.findIndex(c => c.c === sel[0].col);
    if (i >= 0 && i !== S.ink) setInk(i);
  }
}

/* -------------------------------- exports -------------------------------- */

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function exportPNG() {
  const b = contentBounds();
  if (!b) return toast('There is nothing on the board yet');
  const pad = 56;
  const w = b.w + pad * 2, h = b.h + pad * 2;
  const sc = clamp(2600 / Math.max(w, h), .35, 3);
  const cv = document.createElement('canvas');
  cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);
  const c = cv.getContext('2d');
  c.fillStyle = PAPER;
  c.fillRect(0, 0, cv.width, cv.height);
  c.setTransform(sc, 0, 0, sc, -(b.x - pad) * sc, -(b.y - pad) * sc);
  const was = S.ph;
  S.ph = Infinity;
  paintContent(c, S.ph, { ghosts: S.ghosts, inv: sc });
  S.ph = was;
  cv.toBlob(blob => { download(blob, 'palimpsest.png'); toast('Saved as PNG'); }, 'image/png');
}

function exportJSON() {
  download(new Blob([JSON.stringify({ v: 1, els: S.els }, null, 1)], { type: 'application/json' }), 'palimpsest.json');
  toast('Saved as JSON');
}
const fileIn = document.createElement('input');
fileIn.type = 'file';
fileIn.accept = '.json,application/json';
fileIn.style.display = 'none';
on(fileIn, 'change', async () => {
  const f = fileIn.files?.[0];
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.els)) throw new Error('bad file');
    pushHistory();
    S.els = d.els;
    for (const el of S.els) { el.lines = null; el.pts?.forEach(p => (p.p ??= 1)); }
    toNow(); syncDoc(); fitView();
    toast(`Opened ${S.els.length} marks`);
  } catch (_) { toast('That file is not a board'); }
  fileIn.value = '';
});
function importJSON() { fileIn.click(); }

function clearBoard() {
  if (!S.els.length) return;
  pushHistory();
  if (!motion) { S.els = []; syncDoc(); mark(); return; }
  S.wipe = { t0: nowT(), dur: 360 };
  setTimeout(() => { S.els = []; S.wipe = null; syncDoc(); mark(); }, 380);
}

/* --------------------------------- sound --------------------------------- */

let AC = null, penNode = null;
function audio() {
  if (!S.sound) return null;
  if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function penSound(p) {
  const ac = audio();
  if (!ac) return;
  if (!penNode) {
    const len = Math.floor(ac.sampleRate * 2);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let k = 0; k < len; k++) d[k] = Math.random() * 2 - 1;
    const src = ac.createBufferSource();
    src.buffer = buf; src.loop = true;
    const filt = ac.createBiquadFilter();
    filt.type = 'bandpass'; filt.frequency.value = 1700; filt.Q.value = .7;
    const g = ac.createGain(); g.gain.value = 0;
    src.connect(filt).connect(g).connect(ac.destination);
    src.start();
    penNode = { g, filt };
  }
  const t = ac.currentTime;
  penNode.g.gain.setTargetAtTime(.004 + p * .013, t, .015);
  penNode.filt.frequency.setTargetAtTime(1100 + p * 1500, t, .03);
}
function penOff() { if (penNode && AC) penNode.g.gain.setTargetAtTime(0, AC.currentTime, .05); }
function click() { tick(340, .05, .04); }
function tick(f, gain = .06, dur = .08) {
  const ac = audio();
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.value = f;
  g.gain.setValueAtTime(0, ac.currentTime);
  g.gain.linearRampToValueAtTime(gain, ac.currentTime + .008);
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
  o.connect(g).connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur + .02);
}

/* -------------------------------- keyboard -------------------------------- */

const TOOLKEY = { v: 'select', p: 'pen', h: 'marker', e: 'eraser', r: 'rect', o: 'ellipse', d: 'diamond', g: 'triangle', l: 'line', a: 'arrow', t: 'text', n: 'note', s: 'hand' };

on(window, 'keydown', e => {
  if (editing) return;
  const meta = e.metaKey || e.ctrlKey;
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;

  if (e.code === 'Space') {
    if (tag !== 'BUTTON') { spaceDown = true; board.style.cursor = 'grab'; e.preventDefault(); }
    return;
  }
  if (meta) {
    const k = e.key.toLowerCase();
    if (k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (k === 'y') { e.preventDefault(); redo(); return; }
    if (k === 'a') { e.preventDefault(); S.sel = new Set(S.els.filter(x => x.t <= S.ph).map(x => x.eid)); syncInspector(); mark(); return; }
    if (k === 'd') { e.preventDefault(); duplicate(); return; }
    if (k === 's') { e.preventDefault(); exportPNG(); return; }
    if (k === 'o') { e.preventDefault(); importJSON(); return; }
    return;
  }

  switch (e.key) {
    case 'Escape':
      if ($('#sheet').classList.contains('on')) { toggleSheet(); return; }
      if (S.ph !== Infinity) { toNow(); return; }
      S.sel.clear(); syncInspector(); mark(); return;
    case 'Enter': e.preventDefault(); togglePlay(); return;
    case 'Delete': case 'Backspace': e.preventDefault(); deleteSel(); return;
    case '?': toggleSheet('help'); return;
    case '0': fitView(); return;
    case '+': case '=': zoomBy(1.2); return;
    case '-': case '_': zoomBy(1 / 1.2); return;
    case '[': S.weight = Math.max(0, S.weight - 1); syncStyle(); mark(); return;
    case ']': S.weight = Math.min(WEIGHTS.length - 1, S.weight + 1); syncStyle(); mark(); return;
  }

  if (e.key.startsWith('Arrow') && S.sel.size) {
    e.preventDefault();
    const step = e.shiftKey ? 10 : 1;
    const dx = (e.key === 'ArrowRight' ? step : e.key === 'ArrowLeft' ? -step : 0);
    const dy = (e.key === 'ArrowDown' ? step : e.key === 'ArrowUp' ? -step : 0);
    const now = nowT();
    if (now - lastNudge > 600) { pushHistory(); lastNudge = now; }   // holding a key is one undo step
    for (const el of S.els) if (S.sel.has(el.eid)) translateEl(el, dx, dy);
    syncDoc(); mark();
    return;
  }

  const t = TOOLKEY[e.key.toLowerCase()];
  if (t) { setTool(t); hideHint(); }
});
on(window, 'keyup', e => {
  if (e.code === 'Space') { spaceDown = false; board.style.cursor = S.tool === 'hand' ? 'grab' : 'default'; }
});

function deleteSel() {
  if (!S.sel.size) return;
  pushHistory();
  S.els = S.els.filter(el => !S.sel.has(el.eid));
  S.sel.clear();
  syncDoc(); mark(); syncInspector();
}
function duplicate() {
  const list = S.els.filter(el => S.sel.has(el.eid));
  if (!list.length) return;
  pushHistory();
  const d = 18 / S.cam.s;
  const made = [];
  for (const el of list) {
    const c = cloneEl(el);
    c.eid = id(); c.t = nowT(); c.end = nowT(); c.ghost = null;
    translateEl(c, d, d);
    made.push(c);
  }
  S.els.push(...made);
  S.sel = new Set(made.map(m => m.eid));
  syncDoc(); mark();
}

/* --------------------------------- sheets -------------------------------- */

const SHEETS = {
  welcome: {
    kicker: 'Palimpsest',
    h: 'A whiteboard that keeps its own history.',
    body: `<p class="lede">Every mark on this board is stored together with the moment it was made. That is why the strip along the bottom is not a scrollbar — it is the session. Drag its head back and the board takes itself apart in reverse, then plays forward again.</p>
    <p>Be loose. When you let go of a stroke the board reads it: an uneven loop becomes an ellipse, four corners become a rectangle, a straight flick with a barb on the end becomes an arrow. If it is not sure, the ink stays ink. Nothing is ever thrown away — the original stroke stays underneath as the <b>first draft</b>, one button away.</p>`,
    keys: 'help',
  },
  help: {
    kicker: 'Reference',
    h: 'Everything the board does',
    keys: true,
  },
};
const krow = (keys, what) => `<div class="krow">${keys.map(k => `<kbd>${k}</kbd>`).join('')}<span>${what}</span></div>`;

function sheetHTML(name) {
  const s = SHEETS[name];
  let keys = '';
  if (s.keys) {
    const groups = [
      ['Tools', [
        ['V', 'Select'], ['P', 'Pen'], ['H', 'Highlighter'], ['E', 'Eraser'],
        ['R', 'Rectangle'], ['O', 'Ellipse'], ['D', 'Diamond'], ['G', 'Triangle'],
        ['L', 'Line'], ['A', 'Arrow'], ['T', 'Text'], ['N', 'Sticky note'], ['S', 'Hand'],
      ]],
      ['The session', [
        ['Enter', 'Play or pause the reel'], ['Space', 'Drag the board around'],
        ['+', 'Zoom in'], ['−', 'Zoom out'], ['0', 'Zoom to fit'],
        ['drag the strip', 'Scrub back through what you drew'],
      ]],
      ['Editing', [
        ['⌘Z', 'Undo'], ['⇧⌘Z', 'Redo'], ['⌘A', 'Select everything'], ['⌘D', 'Duplicate'],
        ['⌫', 'Delete'], ['↑ ↓ ← →', 'Nudge · with ⇧ for ten'], ['[ ]', 'Stroke weight'],
        ['⌘S', 'Save a PNG'], ['⌘O', 'Open a board'], ['Esc', 'Back to now'],
      ]],
    ];
    keys = `<div class="keys">${groups.map(([title, rows]) =>
      `<h4>${title}</h4>` + rows.map(([k, w]) => krow(k.split(' '), w)).join('')).join('')}</div>`;
  }
  return `<div class="sheet">
    <div class="kicker">${s.kicker}</div>
    <h3>${s.h}</h3>
    ${s.body || ''}
    ${keys}
    <div class="go">
      <button class="btn" type="button" data-go="close">Start drawing</button>
      ${name === 'welcome' ? '<button class="btn ghost" type="button" data-go="help">Show the shortcuts</button>' : '<button class="btn ghost" type="button" data-go="clear">Empty the board</button>'}
    </div>
  </div>`;
}

function toggleSheet(name) {
  const o = $('#sheet');
  if (!name) { o.classList.remove('on'); return; }
  o.innerHTML = sheetHTML(name);
  o.classList.add('on');
  try { localStorage.setItem(SEEN, '1'); } catch (_) { /* ignore */ }
}
on($('#sheet'), 'click', e => {
  const g = e.target.closest('[data-go]') || (e.target.id === 'sheet' ? { dataset: { go: 'close' } } : null);
  if (!g) return;
  if (g.dataset.go === 'help') toggleSheet('help');
  else { toggleSheet(); if (g.dataset.go === 'clear') clearBoard(); }
});

/* ---------------------------------- boot --------------------------------- */

function resize() {
  S.dpr = Math.min(devicePixelRatio || 1, 2);
  S.vw = innerWidth; S.vh = innerHeight;
  board.width = Math.round(S.vw * S.dpr);
  board.height = Math.round(S.vh * S.dpr);
  mark();
}

on(window, 'resize', () => { resize(); drawReel(); syncStack(); });
on(window, 'blur', () => { spaceDown = false; penOff(); });
on(board, 'wheel', e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * .01));
  else { S.cam.x += e.deltaX / S.cam.s; S.cam.y += e.deltaY / S.cam.s; mark(); }
}, { passive: false });

buildUI();
resize();
setTool('pen');
const restored = load();
if (restored) { fitView(); toast(`Picked up ${S.els.length} marks from last time`); }
else { S.cam = { x: -S.vw / 2, y: -S.vh / 2, s: 1 }; }
syncDoc(); syncStyle();
let firstShow = false;
try { firstShow = !localStorage.getItem(SEEN); } catch (_) { firstShow = true; }
if (firstShow) setTimeout(() => toggleSheet('welcome'), 480);

let last = performance.now();
function frame(now) {
  const dt = Math.min(64, now - last);
  last = now;
  if (S.morph) {
    if (now - S.morph.t0 >= S.morph.dur) { const m = S.morph; S.morph = null; finishResolve(m.el, m.r); }
    else mark();
  }
  if (S.ping) { if (now - S.ping.t0 >= S.ping.dur) S.ping = null; else mark(); }
  if (S.wipe) { if (now - S.wipe.t0 >= S.wipe.dur) { S.wipe = null; S.els = []; syncDoc(); } else mark(); }
  if (S.playing) {
    S.ph += dt;
    if (S.ph >= S.t1) { S.ph = Infinity; S.playing = false; updatePastUI(); }
    mark();
  }
  if (dirty) { dirty = false; paint(); drawReel(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
