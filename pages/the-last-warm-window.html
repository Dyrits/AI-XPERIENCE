function setPause(value){paused=value;$('#pause').textContent=paused?'Play':'Pause';$('#pause').setAttribute('aria-label',paused?'Play story':'Pause story');if(audio)master.gain.setTargetAtTime(audioOn&&!paused?.6:0,audio.currentTime,.2)}
function selectChapter(index,immediate=false){current=index;const c=chapters[index];clearTimeout(wordTimer);const show=()=>{$('#chapter').textContent=c.title;$('#words').innerHTML=c.words;$('#subline').textContent=c.sub;$('#words').classList.remove('fading');$('#subline').style.opacity=1};if(immediate)show();else{$('#words').classList.add('fading');$('#subline').style.opacity=0;wordTimer=setTimeout(show,800)}document.querySelectorAll('.stop').forEach((b,i)=>{b.classList.toggle('active',i===index);b.setAttribute('aria-current',i===index?'step':'false')});$('#hold').classList.toggle('shown',index>=1&&index<=4);if(index===5)release()}
chapters.forEach((c,i)=>{let b=document.createElement('button');b.className='stop';b.disabled=true;b.setAttribute('aria-label',c.title);b.title=c.title;b.onclick=()=>{storyTime=c.at;ended=false;$('#replay').classList.remove('visible');setPause(reduced);selectChapter(i,true);render()};$('.route').appendChild(b)});
function begin(){started=true;ended=false;storyTime=0;current=-1;holding=false;warm=0;document.body.classList.add('started');$('#intro').classList.add('dismissed');$('#story').classList.add('visible');$('#replay').classList.remove('visible');document.querySelectorAll('.stop').forEach(b=>b.disabled=false);setPause(reduced);selectChapter(0,true);$('#timeLabel').textContent='THE 18:04 / NEVER EARLY';$('#pause').focus();if(reduced)$('#timeLabel').textContent='USE THE STOPS TO READ AT YOUR PACE'}
$('#begin').onclick=begin;$('#replay').onclick=begin;$('#pause').onclick=()=>{if(ended)begin();else setPause(!paused)};
function hold(){if(!started||current<1||current>4)return;holding=true;$('#hold').classList.add('lit');$('#hold').setAttribute('aria-pressed','true')}
function release(){holding=false;$('#hold').classList.remove('lit');$('#hold').setAttribute('aria-pressed','false')}
$('#hold').addEventListener('pointerdown',e=>{e.preventDefault();$('#hold').setPointerCapture(e.pointerId);hold()});$('#hold').addEventListener('pointerup',release);$('#hold').addEventListener('pointercancel',release);$('#hold').addEventListener('lostpointercapture',release);$('#hold').addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();hold()}});$('#hold').addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();release()}});$('#hold').addEventListener('blur',release);addEventListener('blur',()=>{release();if(started&&!ended)setPause(true)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&started)setPause(true)});
function frame(now){let dt=Math.min((now-last)/1000||0,.05);last=now;if(!paused){if(!reduced)visualTime+=dt;if(started&&!ended)storyTime=Math.min(duration,storyTime+dt*(holding?.18:1))}warm+=(Number(holding)-warm)*Math.min(1,dt*2.5);if(started){let index=chapters.findLastIndex(c=>storyTime>=c.at);if(index!==current)selectChapter(index);$('#fill').style.width=storyTime/duration*100+'%';if(storyTime>=duration&&!ended){ended=true;$('#replay').classList.add('visible');$('#pause').textContent='Replay';$('#pause').setAttribute('aria-label','Replay story');$('#timeLabel').textContent='THE TEA IS COLD. THE LIGHT IS ON.';if(audio)master.gain.setTargetAtTime(0,audio.currentTime,3)}}if(!document.hidden)render();music();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
