<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111210">
<title>Replace you / An 18-second motion study</title>
<style>
:root{color-scheme:dark;--paper:#ece9df;--acid:#d9ff43}*{box-sizing:border-box}body{margin:0;background:#111210;color:var(--paper);font-family:Arial,Helvetica,sans-serif;overflow:hidden}main{height:100svh;display:grid;place-items:center;padding:62px 24px 98px}canvas{display:block;width:100%;height:100%;object-fit:contain}header{position:absolute;top:25px;left:30px;right:30px;display:flex;justify-content:space-between;font:10px monospace;letter-spacing:2px;text-transform:uppercase}header span:last-child{color:#9a9b92}footer{position:absolute;bottom:22px;left:30px;right:30px;display:flex;align-items:center;gap:18px}button{border:1px solid #45463d;background:transparent;color:var(--paper);height:36px;padding:0 14px;font:10px monospace;letter-spacing:1px;cursor:pointer}button:hover,button:focus-visible{border-color:var(--acid);color:var(--acid)}button:focus-visible,input:focus-visible{outline:2px solid var(--acid);outline-offset:5px}#play{min-width:80px}input{accent-color:var(--acid);min-width:30px;flex:1;cursor:pointer}output{font:11px monospace;white-space:nowrap;color:#b5b6ac}#caption{position:absolute;bottom:69px;left:30px;font:10px monospace;color:#999b90;letter-spacing:1px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){main{padding:70px 0 130px}header{left:16px;right:16px;font-size:8px;letter-spacing:1px}footer{left:16px;right:16px;gap:9px;flex-wrap:wrap}button{padding:0 9px}#caption{left:16px;bottom:108px;font-size:8px}#fullscreen{display:none}output{font-size:9px}}
</style>
</head>
<body>
<header><span>Human / machine · Motion study 001</span><span>18 seconds · Endless question</span></header>
<main><canvas id="film" width="1600" height="900" role="img" aria-label="Animated film: AI will replace you. Will it kill you? A human silhouette is scanned and duplicated; a pulse goes flat, then beats again. The film ends with the question still open."></canvas></main>
<div id="caption">KINETIC TYPE / GENERATIVE IMAGE / SYNTHESIZED SCORE</div>
<footer><button id="play" aria-label="Pause animation">PAUSE</button><button id="sound" aria-pressed="false">SOUND OFF</button><input id="seek" type="range" min="0" max="18" step="0.01" value="0" aria-label="Film timeline in seconds"><output id="time">00.00 / 18</output><button id="fullscreen">FULLSCREEN</button></footer>
<p class="sr">Space pauses or plays. Left and right arrows step through the film. Sound is optional. Reduced-motion preferences start the film paused.</p>
<script>
'use strict';
const canvas=document.getElementById('film'),ctx=canvas.getContext('2d');
const play=document.getElementById('play'),sound=document.getElementById('sound'),seek=document.getElementById('seek'),readout=document.getElementById('time');
const W=1600,H=900,DURATION=18,PAPER='#ece9df',INK='#111210',ACID='#d9ff43',RED='#fa482e';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let running=!reduced,position=0,last=performance.now(),audio=null,master=null,soundOn=false,lastBeat=-1;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=x=>1-Math.pow(1-clamp(x),3);
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const mix=(a,b,t)=>a+(b-a)*t;
const hash=n=>{const v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v)};
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function line(x,y,xx,yy,c,width=2){ctx.strokeStyle=c;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.stroke()}
function circle(x,y,r,c,stroke=false,width=2){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2);ctx.lineWidth=width;ctx[stroke?'strokeStyle':'fillStyle']=c;ctx[stroke?'stroke':'fill']()}
function text(s,x,y,size,color=INK,align='center',outline=false){ctx.font=`900 ${size}px Arial, Helvetica, sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineJoin='round';ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineWidth=2;if(outline)ctx.strokeText(s,x,y);else ctx.fillText(s,x,y)}
function mono(s,x,y,color=INK,size=15,align='left'){ctx.font=`${size}px monospace`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function tag(s,x,y,c=INK){rect(x,y,ctx.measureText(s).width+32,30,c);mono(s,x+12,y+15,PAPER,12)}
function human(x,y,scale,color,outline=false){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);circle(0,-105,30,color,outline,2);ctx.beginPath();ctx.moveTo(-38,-60);ctx.quadraticCurveTo(-60,-45,-62,20);ctx.lineTo(-38,20);ctx.lineTo(-30,130);ctx.lineTo(-5,130);ctx.lineTo(0,45);ctx.lineTo(5,130);ctx.lineTo(30,130);ctx.lineTo(38,20);ctx.lineTo(62,20);ctx.quadraticCurveTo(60,-45,38,-60);ctx.closePath();ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineWidth=2;ctx[outline?'stroke':'fill']();ctx.restore()}
function registration(c,t,label){mono('R / Y',44,40,c,16);mono(label,800,40,c,13,'center');mono(String(Math.floor(t*24)).padStart(4,'0')+' / 0432',1556,40,c,14,'right');for(const [x,y,sx,sy]of [[24,70,1,1],[1576,70,-1,1],[24,830,1,-1],[1576,830,-1,-1]]){line(x,y,x+20*sx,y,c);line(x,y,x,y+20*sy,c)}mono('ARTIFICIAL INTELLIGENCE / HUMAN CONSEQUENCE',44,860,c,12);mono('↗ 18:00',1556,860,c,12,'right')}
function grid(c,alpha=.12){ctx.save();ctx.globalAlpha=alpha;for(let x=0;x<W;x+=80)line(x,70,x,830,c,1);for(let y=70;y<831;y+=80)line(0,y,W,y,c,1);ctx.restore()}
function rings(t,c){ctx.save();ctx.translate(800,450);for(let i=0;i<8;i++){ctx.save();ctx.rotate(t*.35+i*.32);ctx.strokeStyle=c;ctx.lineWidth=i===0?4:1;ctx.beginPath();ctx.ellipse(0,0,300+i*18,60+i*26,0,0,Math.PI*2);ctx.stroke();ctx.restore()}ctx.restore()}
function intro(t){rect(0,0,W,H,ACID);grid(INK,.1);rings(t,INK);const intro=ease(t/.65);ctx.save();ctx.translate(800,450);ctx.scale(mix(2.7,1,intro),mix(.1,1,intro));text('AI',0,0,460);ctx.restore();const a=clamp((t-.65)/.3);ctx.globalAlpha=a;mono('IT LEARNED TO THINK.',54,710,INK,20);mono('THEN IT LEARNED YOUR JOB.',54,742,INK,20);ctx.globalAlpha=1;const offset=(t*240)%280;for(let i=-1;i<7;i++){const x=i*280+offset;rect(x,791,170,7,INK)}registration(INK,t,'01 / THE ARRIVAL');if(t>2.3){const p=ease((t-2.3)/.4);rect(0,0,W*p,H,INK);text('WILL',W*p-70,450,260,ACID,'right')}}
function replace(t){const s=t-2.7;rect(0,0,W,H,INK);grid(PAPER,.065);const p=ease(s/.45);ctx.save();ctx.translate(800,235);ctx.scale(1,mix(.1,1,p));text('WILL REPLACE',0,0,185,PAPER);ctx.restore();const shift=s*230;for(let i=-2;i<10;i++){const x=i*220-shift%220;human(x,520,1,ACID,true);mono('HUMAN_'+String(i+3+Math.floor(shift/220)).padStart(3,'0'),x,704,PAPER,12,'center')}const scanner=800+Math.sin(s*2)*300;ctx.save();ctx.beginPath();ctx.rect(scanner-105,335,210,410);ctx.clip();rect(scanner-105,335,210,410,ACID);for(let i=-2;i<10;i++){const x=i*220-shift%220;human(x,520,1,INK)}ctx.restore();line(scanner-105,323,scanner-105,756,ACID,3);mono('COPY COMPLETE',scanner,781,ACID,15,'center');mono('×'+String(Math.floor(s*149)+1).padStart(4,'0'),1440,510,ACID,27,'center');registration(PAPER,t,'02 / THE SUBSTITUTION');if(s>2.15){const q=ease((s-2.15)/.55);rect(0,H*(1-q),W,H*q,RED);text('YOU.',800,mix(1050,452,q),440,INK)}}
function you(t){const s=t-5.4;rect(0,0,W,H,RED);const zoom=1+.045*Math.sin(s*5);ctx.save();ctx.translate(800,447);ctx.scale(zoom,zoom);text('YOU.',0,0,440,INK);ctx.restore();const expand=ease(s/.6);for(let i=0;i<4;i++){ctx.save();ctx.globalAlpha=.45-i*.09;const y=450+(i+1)*130*expand;text('YOU.',800,y,440,INK,'center',true);text('YOU.',800,900-y,440,INK,'center',true);ctx.restore()}rect(80,696,450,61,INK);mono('POSITION NO LONGER REQUIRED.',102,728,PAPER,20);mono('100% REPLICABLE?',1518,727,INK,22,'right');registration(INK,t,'03 / THE DISPLACEMENT');if(s>1.1){ctx.save();const q=ease((s-1.1)/.6);ctx.translate(800,450);ctx.rotate(-.12);rect(-1000,-80,2000*q,160,INK);text('WILL IT',0,0,140,PAPER);ctx.restore()}}
function kill(t){const s=t-7.2;rect(0,0,W,H,PAPER);grid(INK,.08);const entry=ease(s/.45);text('WILL IT',800,195,150,INK);ctx.save();ctx.translate(800,422);ctx.scale(mix(1.9,1,entry),entry);text('KILL',0,0,380,RED);ctx.restore();text('YOU?',800,696,194,INK);const target=200+1200*clamp(s/2.8);line(target,80,target,820,RED,2);circle(target,450,55,RED,true,2);line(target-72,450,target+72,450,RED,2);mono('THREAT ASSESSMENT',60,400,INK,13);mono('UNKNOWN',60,425,RED,22);mono('NO CERTAIN ANSWER',1540,472,INK,13,'right');for(let i=0;i<16;i++){let x=hash(i)*1600;let y=100+hash(i+40)*680;ctx.globalAlpha=.15;rect(x,y,2+hash(i+20)*60,3,INK)}ctx.globalAlpha=1;registration(INK,t,'04 / THE QUESTION');if(s>2.1){const q=ease((s-2.1)/.6);rect(0,0,W,H*q/2,INK);rect(0,H-H*q/2,W,H*q/2,INK)}}
function ecg(x){const p=((x%1)+1)%1;return -Math.exp(-Math.pow((p-.36)/.035,2))*.15+Math.exp(-Math.pow((p-.43)/.016,2))*1.1-Math.exp(-Math.pow((p-.47)/.025,2))*.46+Math.exp(-Math.pow((p-.64)/.08,2))*.17}
function pulse(t){const s=t-10;rect(0,0,W,H,INK);grid(PAPER,.055);const dying=1-smooth((s-.1)/.95);ctx.strokeStyle=ACID;ctx.lineWidth=4;ctx.beginPath();for(let x=0;x<=1600;x+=2){const v=ecg(x/330-s*1.5)*dying;const y=450-v*155;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();const cursor=(s*550)%1600;circle(cursor,450-ecg(cursor/330-s*1.5)*dying*155,7,ACID);ctx.globalAlpha=smooth((s-.7)/.5);text('IS THAT',800,265,110,PAPER);text('THE END?',800,661,150,PAPER);ctx.globalAlpha=1;mono(dying>.1?'SIGNAL / FADING':'SIGNAL / LOST',60,770,ACID,18);registration(PAPER,t,'05 / THE SILENCE')}
function alive(t){const s=t-12.5;rect(0,0,W,H,ACID);grid(INK,.08);const beat=Math.pow(Math.max(0,Math.sin(s*Math.PI*2*1.4)),12);for(let i=0;i<7;i++){const p=((s*.52+i/7)%1);ctx.globalAlpha=(1-p)*.5;circle(800,450,p*850,INK,true,2)}ctx.globalAlpha=1;ctx.save();ctx.translate(800,451);ctx.scale(1+beat*.075,1+beat*.075);text('STILL',0,-125,255,INK);text('HERE.',0,125,255,INK);ctx.restore();human(1425,692,.4,INK);mono('A PULSE IS NOT A PREDICTION.',65,772,INK,21);registration(INK,t,'06 / THE HUMAN');if(s>2.1){const q=ease((s-2.1)/.4);rect(0,0,W*q,H,PAPER)}}
function ending(t){const s=t-15;rect(0,0,W,H,PAPER);const p=ease(s/.5);ctx.save();ctx.translate(80,mix(260,212,p));text('AI WILL',0,0,160,INK,'left');text('REPLACE YOU.',0,164,160,INK,'left');text('WILL IT',0,342,160,INK,'left');text('KILL YOU?',0,506,160,RED,'left');ctx.restore();ctx.save();ctx.translate(1375,484);ctx.rotate(s*.55);for(let i=0;i<16;i++){ctx.rotate(Math.PI/8);rect(80,-4,88,8,INK)}ctx.restore();circle(1375,484,63,RED);text('?',1375,488,95,PAPER);mono('THE QUESTION IS STILL OPEN.',83,791,INK,18);registration(INK,t,'07 / REPEAT THE QUESTION');if(s>2.5){const q=smooth((s-2.5)/.5);ctx.save();ctx.beginPath();ctx.arc(1375,484,q*1800,0,Math.PI*2);ctx.clip();intro(0);ctx.restore()}}
function draw(t){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;if(t<2.7)intro(t);else if(t<5.4)replace(t);else if(t<7.2)you(t);else if(t<10)pulseTransition(t);else if(t<12.5)pulse(t);else if(t<15)alive(t);else ending(t);ctx.save();ctx.globalAlpha=.04;for(let i=0;i<1000;i++){const x=hash(i*2)*W,y=hash(i*2+1)*H;rect(x,y,1.5,1.5,INK)}ctx.restore()}
function pulseTransition(t){kill(t)}
function updateUI(){play.textContent=running?'PAUSE':'PLAY';play.setAttribute('aria-label',running?'Pause animation':'Play animation');seek.value=position;readout.textContent=position.toFixed(2).padStart(5,'0')+' / 18'}
function mute(){if(master&&audio)master.gain.setTargetAtTime(0,audio.currentTime,.02)}
function toggle(){running=!running;last=performance.now();lastBeat=-1;if(!running)mute();else if(audio&&soundOn){audio.resume();master.gain.setTargetAtTime(.22,audio.currentTime,.03)}updateUI()}
function tone(freq,start,length,type='sine',volume=.3,end=freq){const osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,start);osc.frequency.exponentialRampToValueAtTime(Math.max(1,end),start+length);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(volume,start+.006);gain.gain.exponentialRampToValueAtTime(.0001,start+length);osc.connect(gain);gain.connect(master);osc.start(start);osc.stop(start+length+.03);osc.onended=()=>{osc.disconnect();gain.disconnect()}}
function score(t){if(!audio||!soundOn||!running)return;const b=Math.floor(t*8);if(b===lastBeat)return;lastBeat=b;const now=audio.currentTime;if(t>=10&&t<12.5){if(b===80)tone(700,now,1.35,'sine',.2,700);return}if(t>=12.5&&t<15){if(b%6===0){tone(80,now,.15,'sine',.7,35);tone(65,now+.16,.15,'sine',.5,30)}return}if(b%4===0)tone(130,now,.19,'sine',.8,35);if(b%4===2)tone(170,now,.09,'triangle',.2,55);if(b%2===0)tone([110,110,165,146.83,110,220,164.81,98][Math.floor(b/2)%8],now,.12,'sawtooth',.11);tone(2200+hash(b)*3000,now,.025,'square',.025,400);if([0,21,43,57,120].includes(b)){tone(65,now,.7,'sawtooth',.4,28);tone(880,now,.4,'triangle',.12,110)}}
play.addEventListener('click',toggle);
sound.addEventListener('click',async()=>{try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=0;master.connect(audio.destination)}await audio.resume();soundOn=!soundOn;master.gain.setTargetAtTime(soundOn&&running?.22:0,audio.currentTime,.025);sound.textContent=soundOn?'SOUND ON':'SOUND OFF';sound.setAttribute('aria-pressed',String(soundOn));lastBeat=-1}catch{sound.textContent='NO AUDIO';sound.disabled=true}});
seek.addEventListener('input',()=>{position=Number(seek.value);last=performance.now();lastBeat=-1;draw(position===18?17.999:position);updateUI()});
document.addEventListener('keydown',e=>{if(e.target.closest('button,input'))return;if(e.code==='Space'){e.preventDefault();toggle()}else if(e.code==='ArrowLeft'||e.code==='ArrowRight'){e.preventDefault();position=clamp(position+(e.code==='ArrowRight'?1:-1)/24,0,17.999);last=performance.now();draw(position);updateUI()}});
const full=document.getElementById('fullscreen');if(!document.documentElement.requestFullscreen)full.hidden=true;full.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{full.textContent='UNAVAILABLE'}});
document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden)mute();else if(soundOn&&running&&audio)master.gain.setTargetAtTime(.22,audio.currentTime,.03)});
function frame(now){if(running&&!document.hidden){position=(position+Math.min((now-last)/1000,.1))%DURATION;draw(position);score(position);updateUI()}last=now;requestAnimationFrame(frame)}
draw(0);updateUI();requestAnimationFrame(frame);
</script>
</body>
</html>
