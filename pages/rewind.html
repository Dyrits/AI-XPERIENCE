<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2a2140">
<title>Rewind · A deckbuilder about time</title>
<style>
:root{--ink:#2a2140;--cream:#fff6e6;--paper:#fdf0d5;--atk:#ff7b6b;--skl:#45c0b4;--pow:#ffc23d;--time:#9b7bff;--sand:#f4b942;--hp:#ff5d6c;--blk:#5aa9ff;--ghost:#8fd3ff;--f:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Varela Round",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#211a35;color:var(--ink);font-family:var(--f);font-weight:700;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;border-radius:6px;background:#ffd7a6}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block}
.ink{stroke:var(--ink)}
.btn{color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:16px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-size:20px;transition:transform .12s,box-shadow .12s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.big{font-size:26px;padding:14px 34px}
.btn.pri{background:#ffcf4a}
.btn.teal{background:#7fe0c8}
.btn.purp{background:#c9b5ff}
.btn.red{background:#ff9a8a}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:16px}
.ico{display:inline-block;vertical-align:middle}
.small{font-size:13px}
.dim{opacity:.7}
.kw{color:#7a52e8}
.kw.e{color:#2b8f86}
.up{color:#2aa35a}
.down{color:#d6453c}
/* backgrounds */
.sky{position:absolute;inset:0;background:linear-gradient(#ffcf9c 0%,#ffb9a3 45%,#f6a6b8 100%)}
.act2 .sky{background:linear-gradient(#7b68c9 0%,#c98bc2 50%,#f7a58f 100%)}
.bigclock{position:absolute;left:50%;top:330px;width:760px;height:760px;margin:-380px 0 0 -380px;opacity:.16}
.bigclock .hand1{transform-origin:380px 380px;animation:spin 60s linear infinite}
.bigclock .hand2{transform-origin:380px 380px;animation:spin 6s linear infinite}
.rewinding .bigclock .hand1{animation-duration:1s;animation-direction:reverse}
.rewinding .bigclock .hand2{animation-duration:.3s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.75;box-shadow:inset 0 -6px 0 rgba(42,33,64,.08)}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:150%;left:15%;top:-60%}
.cloud::after{width:40%;height:120%;left:48%;top:-40%}
.cloud{left:-260px;animation:drift linear infinite}
@keyframes drift{to{transform:translateX(1600px)}}
.act2 .cloud{opacity:.4}
.bubs{animation:bubs 3s ease-in-out infinite}
@keyframes bubs{50%{transform:translateY(-7px)}}
.spk{animation:twk 1.6s ease-in-out infinite}
@keyframes twk{50%{opacity:.3}}
.ground{position:absolute;left:-40px;right:-40px;top:420px;height:340px;background:#b6e39a;border-top:4px solid var(--ink);border-radius:50% 50% 0 0/40px 40px 0 0}
.act2 .ground{background:#8fc3a2}
.ground::after{content:'';position:absolute;left:0;right:0;top:26px;height:14px;background:rgba(42,33,64,.08);border-radius:50%}
/* top bar */
#top{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(255,246,230,.92);border-bottom:3px solid var(--ink);z-index:30}
#top .stat{display:flex;align-items:center;gap:6px;font-size:19px}
#tonics{display:flex;gap:6px;margin-left:10px}
.tonic{width:34px;height:34px;border-radius:10px;border:3px dashed rgba(42,33,64,.35);display:flex;align-items:center;justify-content:center;position:relative}
.tonic.full{border:3px solid var(--ink);background:#fff;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.tonic.full:hover{transform:translateY(-2px)}
#relics{display:flex;gap:4px;margin-left:10px;flex-wrap:wrap;max-width:430px}
.relic{width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;position:relative}
.relic.used{opacity:.4}
.relic .cnt{position:absolute;right:-6px;bottom:-6px;font-size:11px;background:var(--ink);color:#fff;border-radius:8px;padding:0 4px}
#top .sp{flex:1}
#top .floor{font-size:15px}
.tbtn{padding:5px 10px;border-radius:10px;border:3px solid var(--ink);background:#fff;font-size:13px;box-shadow:0 3px 0 var(--ink)}
.tbtn:hover{background:#fff3c4}
.tbtn.off{opacity:.5;text-decoration:line-through}
/* battle */
#battle{z-index:1}
#field{position:absolute;inset:0}
.ent{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.ent svg.blob{display:block;overflow:visible}
.ent .bars{margin-top:4px;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
.hpbar{position:relative;width:130px;height:18px;border-radius:9px;background:#fff;border:3px solid var(--ink);overflow:hidden}
.hpbar .f{position:absolute;left:0;top:0;bottom:0;background:var(--hp);transition:width .35s}
.hpbar .g{position:absolute;left:0;top:0;bottom:0;background:#ffd0d4;transition:width .9s .25s}
.hpbar .t{position:absolute;inset:0;text-align:center;font-size:12px;line-height:13px;color:var(--ink)}
.hpbar.blk{border-color:var(--blk)}
.blkb{position:absolute;left:-26px;top:50%;transform:translateY(-50%);width:28px;height:30px;display:none;align-items:center;justify-content:center;font-size:13px;color:#fff;z-index:2}
.blkb.on{display:flex}
.blkb svg{position:absolute;inset:0}
.blkb span{position:relative}
.sts{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:170px;min-height:22px}
.st{position:relative;width:22px;height:22px;border-radius:7px;background:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;pointer-events:auto}
.st b{position:absolute;right:-5px;bottom:-6px;font-size:11px;background:var(--ink);color:#fff;border-radius:6px;padding:0 3px;line-height:14px}
.intent{position:absolute;top:-6px;left:50%;transform:translate(-50%,-100%);display:flex;align-items:center;gap:4px;padding:4px 10px 4px 6px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:17px;white-space:nowrap;pointer-events:auto;animation:bob 2.4s ease-in-out infinite}
.intent .n{font-size:18px}
.intent.atk{background:#ffe2dc}
.intent.veil{background:#e2dcf7}
.intent.mem{background:#e6f4ff}
@keyframes bob{50%{transform:translate(-50%,calc(-100% - 5px))}}
.ghostnote{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);font-size:12px;color:#2f6ea8;background:rgba(230,244,255,.92);border:2px dashed #5aa9ff;border-radius:10px;padding:2px 8px;white-space:nowrap}
.ent.targetable{cursor:crosshair}
.ent.targetable .blob .body{filter:drop-shadow(0 0 0 #fff)}
.ent.hot .blob{filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 4px #ffcf4a)}
.ent.dead{pointer-events:none}
.ent .shadow{position:absolute;bottom:-2px;left:50%;width:70%;height:16px;transform:translateX(-50%);border-radius:50%;background:rgba(42,33,64,.18);z-index:-1}
/* time panel */
#timepanel{position:absolute;left:14px;top:120px;width:150px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:5}
#glass{position:relative;width:96px;height:132px;cursor:help}
#sandn{font-size:20px;text-align:center;margin-top:-6px}
#rwbtn{width:150px;padding:9px 6px;font-size:17px;flex-direction:column;gap:0;line-height:1.1;background:#c9b5ff}
#rwbtn small{font-size:12px;opacity:.85}
#capsule{width:150px;padding:6px;border-radius:14px;border:3px solid var(--ink);background:rgba(255,255,255,.75);text-align:center;font-size:12px;cursor:pointer;transition:background .2s}
#capsule:hover{background:#e6f4ff}
#capsule.mode{background:#cfeaff;box-shadow:0 0 0 4px #5aa9ff}
#capsule .slots{display:flex;gap:4px;justify-content:center;margin-top:4px}
#capsule .slot{width:40px;height:54px;border-radius:7px;border:2px dashed rgba(42,33,64,.4);display:flex;align-items:center;justify-content:center;font-size:9px;line-height:1;padding:2px;overflow:hidden}
#capsule .slot.f{border:2px solid var(--ink);background:var(--ghost);color:var(--ink)}
#timeline{position:absolute;left:50%;top:62px;transform:translateX(-50%);display:flex;align-items:center;gap:0;padding:4px 10px;border-radius:12px;background:#2a2140;box-shadow:0 3px 0 rgba(0,0,0,.25);z-index:4}
#timeline .lbl{color:#c9b5ff;font-size:11px;letter-spacing:.12em;margin-right:8px}
.frame{position:relative;width:46px;height:30px;margin:0 2px;border-radius:5px;background:#fff6e6;color:var(--ink);font-size:10px;line-height:12px;text-align:center;padding-top:2px;cursor:help;transition:background .2s,transform .2s}
.frame::before,.frame::after{content:'';position:absolute;left:4px;right:4px;height:3px;background:repeating-linear-gradient(90deg,#2a2140 0 4px,transparent 4px 7px)}
.frame::before{top:-4px}.frame::after{bottom:-4px}
.frame.cur{background:#ffcf4a}
.frame.tgt{background:#c9b5ff;transform:translateY(-2px) scale(1.08)}
.frame.erased{background:#6a5c8c;color:#c9b5ff;text-decoration:line-through}
#future{position:absolute;left:180px;top:104px;display:flex;gap:6px;flex-wrap:wrap;max-width:420px;z-index:4}
.fut{display:flex;align-items:center;gap:4px;padding:2px 8px 2px 4px;border-radius:10px;background:rgba(255,255,255,.85);border:2px solid var(--ink);font-size:12px}
.fut b{background:var(--ink);color:#fff;border-radius:6px;padding:0 4px}
/* bottom */
#energy{position:absolute;left:36px;top:520px;width:96px;height:96px;z-index:6}
#energy .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--ink)}
.pile{position:absolute;width:66px;height:80px;z-index:6;cursor:pointer}
.pile .stack{position:absolute;inset:0;border-radius:10px;border:3px solid var(--ink);background:#7d6bd6;box-shadow:4px 4px 0 var(--ink),2px 2px 0 #fff}
.pile .c{position:absolute;right:-10px;bottom:-10px;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:14px}
.pile .l{position:absolute;left:0;right:0;top:28px;text-align:center;color:#fff;font-size:12px}
#drawp{left:44px;top:630px}
#discp{left:1170px;top:630px}
#discp .stack{background:#e8805f}
#exhp{left:1090px;top:650px;width:46px;height:56px}
#exhp .stack{background:#9b9b9b}
#exhp .l{top:16px;font-size:10px}
#endbtn{position:absolute;left:1110px;top:540px;width:150px;z-index:6;font-size:22px}
#endbtn.glow{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 5px 0 var(--ink),0 0 0 6px rgba(255,207,74,.6)}}
#hand{position:absolute;left:0;right:0;top:0;height:720px;pointer-events:none;z-index:10}
/* cards */
.card{position:absolute;width:146px;height:204px;border-radius:16px;background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);pointer-events:auto;cursor:pointer;transition:transform .18s cubic-bezier(.3,1.4,.6,1),left .25s,top .25s,opacity .2s,filter .2s;transform-origin:50% 100%}
.card .hd{position:absolute;left:6px;right:6px;top:6px;height:30px;border-radius:10px;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;padding:0 14px 0 20px;text-align:center;white-space:nowrap}
.card.t-atk .hd{background:var(--atk)}
.card.t-skl .hd{background:var(--skl)}
.card.t-pow .hd{background:var(--pow)}
.card.t-sts .hd{background:#bbb}
.card .art{position:absolute;left:12px;right:12px;top:42px;height:64px;border-radius:10px;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden}
.card.t-atk .art{background:#ffe0d8}
.card.t-skl .art{background:#d6f4ef}
.card.t-pow .art{background:#fff0c4}
.card.t-sts .art{background:#ddd}
.card .ty{position:absolute;left:0;right:0;top:106px;text-align:center;font-size:10px;letter-spacing:.1em;opacity:.65;text-transform:uppercase}
.card .ds{position:absolute;left:8px;right:8px;top:120px;bottom:8px;font-size:12px;line-height:1.22;text-align:center;display:flex;align-items:center;justify-content:center}
.card .cost{position:absolute;left:-12px;top:-12px;width:36px;height:36px;border-radius:50%;background:#ffcf4a;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:19px;z-index:2}
.card .cost.free{background:#a7f0b5}
.card .cost.bad{background:#ddd;color:#888}
.card .sandc{position:absolute;right:-11px;top:-11px;width:32px;height:32px;border-radius:9px;transform:rotate(45deg);background:var(--time);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;z-index:2}
.card .sandc span{transform:rotate(-45deg);font-size:15px;color:#fff}
.card .sandc.bad{background:#bbb}
.card.upg .hd{color:#155c2c}
.card.upg .hd::after{content:'+';margin-left:2px}
.card.rar-u{background:#eaf6ff}
.card.rar-r{background:#fff1c9}
.card.ghost{background:#d5efff;opacity:.92;border-style:dashed}
.card.ghost::after{content:'GHOST';position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:10px;background:#5aa9ff;color:#fff;padding:1px 6px;border-radius:6px;border:2px solid var(--ink)}
.card.unplay{filter:saturate(.4)}
.card.sel{filter:drop-shadow(0 0 10px #ffcf4a)}
.card.sendable{box-shadow:0 5px 0 var(--ink),0 0 0 5px #5aa9ff}
.card.inhand{transform:rotate(var(--r))}
.card.inhand:hover,.card.inhand.sel{transform:translateY(-66px) scale(1.14) rotate(0deg);z-index:60!important}
.card.enter{animation:enter .35s cubic-bezier(.3,1.3,.6,1) backwards}
@keyframes enter{from{transform:translate(-520px,160px) scale(.3) rotate(-30deg);opacity:0}}
.btn.dis{opacity:.5;filter:grayscale(.6)}
.card.mini{position:relative;transform:scale(.8);transform-origin:50% 50%}
.card.static{position:relative;display:inline-block;cursor:default}
.card.pick{cursor:pointer}
.card.pick:hover{transform:translateY(-6px) scale(1.04)}
#arrow{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:visible}
/* overlays */
.ov{position:absolute;inset:0;background:rgba(42,33,64,.72);z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;color:#fff}
.ov h2{font-size:38px;text-shadow:0 4px 0 var(--ink);color:#fff6e6}
.ov .sub{font-size:16px;opacity:.85;max-width:760px;text-align:center}
.grid{display:flex;flex-wrap:wrap;gap:26px 22px;justify-content:center;max-width:1180px;max-height:520px;overflow-y:auto;padding:22px 20px 30px}
.grid .card{position:relative}
.panel{background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink);padding:22px 26px}
#tip{position:absolute;z-index:200;pointer-events:none;max-width:260px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.3;box-shadow:0 4px 0 var(--ink);display:none;color:var(--ink)}
#tip h4{font-size:14px;margin-bottom:2px}
#tip .tline{margin-top:5px;padding-top:5px;border-top:2px dashed rgba(42,33,64,.2)}
.float{position:absolute;z-index:60;font-size:30px;pointer-events:none;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);animation:fl 1.1s ease-out forwards;white-space:nowrap}
.float.heal{color:#8af0a0}.float.blk{color:#9ccfff}.float.sand{color:#ffd56a}.float.word{font-size:22px;color:#fff6e6}.float.dmg{color:#ff6b6b}
@keyframes fl{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-14px) scale(1.15);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.banner{position:absolute;left:0;right:0;top:250px;text-align:center;font-size:64px;color:#fff6e6;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);z-index:70;pointer-events:none;animation:ban 1.2s ease-out forwards}
@keyframes ban{0%{transform:scale(.4);opacity:0}20%{transform:scale(1.08);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(1.04);opacity:0}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:80}
#vhs{position:absolute;inset:0;pointer-events:none;z-index:79;opacity:0;background:repeating-linear-gradient(0deg,rgba(42,33,64,.18) 0 2px,transparent 2px 5px);mix-blend-mode:multiply}
.rewinding #vhs{opacity:1}
.rewinding #field,.rewinding #hand{filter:sepia(.7) hue-rotate(210deg) saturate(1.6) contrast(1.05)}
.rwlabel{position:absolute;right:30px;top:70px;font-size:34px;color:#fff;z-index:81;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;font-family:ui-monospace,Menlo,monospace;animation:blink .4s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
/* map */
#map .sky{background:linear-gradient(#fff1d6,#ffdcb8)}
#map.act2 .sky{background:linear-gradient(#e7dcff,#ffd3c7)}
#mapscroll{position:absolute;left:0;right:0;top:54px;bottom:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
#mapsvg{display:block;margin:0 auto}
.mnode{cursor:default}
.mnode.reach{cursor:pointer}
.mnode.reach .ring{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.mnode .ring{transform-box:fill-box;transform-origin:center}
.mnode.reach:hover .disc{fill:#ffcf4a}
#maplegend{position:absolute;right:20px;top:80px;z-index:5;font-size:14px;line-height:1.9}
#maptitle{position:absolute;left:24px;top:76px;z-index:5;font-size:30px;text-shadow:0 3px 0 #fff}
#maptitle small{display:block;font-size:14px;opacity:.7;text-shadow:none}
/* title */
#title .logo{position:absolute;left:0;right:0;top:70px;text-align:center}
#title .logo h1{font-size:150px;letter-spacing:.04em;color:#fff6e6;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 10px 0 var(--ink);line-height:1;display:inline-block}
#title .logo h1 span{display:inline-block;animation:wig 3s ease-in-out infinite}
@keyframes wig{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(-3deg)}}
#title .tag{font-size:22px;margin-top:10px;text-shadow:0 2px 0 #fff}
#title .menu{position:absolute;left:0;right:0;top:470px;display:flex;justify-content:center;gap:18px}
#title .meta{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:14px;opacity:.7}
#tblobs{position:absolute;left:0;right:0;top:290px;height:170px}
.howto{max-width:900px;font-size:15px;line-height:1.45}
.howto h3{font-size:19px;margin:10px 0 2px}
.howto b{color:#7a52e8}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 28px}
/* misc screens */
.center{position:absolute;inset:54px 0 0 0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}
.rewlist{display:flex;flex-direction:column;gap:12px;min-width:420px}
.rew{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:14px;border:3px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);font-size:18px;cursor:pointer;text-align:left}
.rew:hover{background:#fff3c4}
.rew.done{opacity:.4;pointer-events:none}
.shopgrid{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.ware{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;position:relative}
.ware .price{font-size:16px;display:flex;align-items:center;gap:3px}
.ware.cant .price{color:#d6453c}
.ware.sold{opacity:.25;pointer-events:none}
.bigicon{width:78px;height:78px;border-radius:50%;background:#fff;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center}
.choice{display:flex;flex-direction:column;gap:12px;min-width:560px}
.choice .btn{justify-content:flex-start;text-align:left;font-size:17px}

function mix(a){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}

case'card':tone(520,.09,'triangle',.14,820);break;

case'sand':[1200,1500,1800].forEach((f,i)=>tone(f,.12,'sine',.07,null,i*.05));break;
case'rewind':{const c=actx();if(!c)return;const t=c.currentTime,o=c.createOscillator(),l=c.createOscillator(),lg=c.createGain(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(1100,t);o.frequency.exponentialRampToValueAtTime(110,t+1);l.frequency.value=18;lg.gain.value=60;l.connect(lg);lg.connect(o.frequency);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.11,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+1.05);const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;f.Q.value=.8;o.connect(f);f.connect(g);g.connect(AU.mg);o.start(t);l.start(t);o.stop(t+1.1);l.stop(t+1.1);noise(1,.12,4000,0,300);tone(880,.18,'sine',.12,1760,1);break}

function musicTick(){const c=AU.ctx;if(!c||!AU.music)return;while(AU.next<c.currentTime+.3){const s=AU.step++,t=AU.next,beat=.33,root=AU.act2?196:220;
  const bar=Math.floor(s/8)%4,ch=[0,5,3,4][bar];

  noise(.03,s%4===0?.05:.025,6000,t-c.currentTime);
  AU.next+=beat}}

function icInner(n,fill){return I(n,32,fill).replace(/^<svg[^>]*>|<\/svg>$/g,'')}
function mouthSVG(L,mood){const w=L.w,h=L.h,my=-h*.34,mw=w*.12;
  if(L.mouth==='beak')return`<path d="M${mw*1.9} ${my} L${-mw*.3} ${my-mw*.75} L${-mw*.3} ${my+mw*.75}Z" fill="#ff9a3c" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;
  const m=mood==='hurt'?'o':mood==='happy'?'smile':(L.mouth||'smile');
  if(m==='teeth')return`<path d="M${-mw*1.7} ${my-5} Q0 ${my+mw*2.1} ${mw*1.7} ${my-5}Z" fill="${INK}"/><path d="M${-mw*1.4} ${my-4} l5 7 5-7 5 7 5-7 5 7 5-6" fill="#fff" stroke="#fff" stroke-width="1" stroke-linejoin="round" transform="translate(${mw*.15} 0)"/>`;
  if(m==='frown')return`<path d="M${-mw} ${my+6} Q0 ${my-5} ${mw} ${my+6}" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`;

 o:[{l:'Dig. Gain 55 gold, take 9 damage.',c:()=>S.hp>9,f:d=>{S.hp-=9;S.gold+=55;sfx('coin');d('Ouch. But shiny.')}},
    {l:'Bottle some sand. Gain a Liquid Sand tonic.',c:()=>S.tonics.includes(null),f:d=>{S.tonics[S.tonics.indexOf(null)]='liquid';sfx('sand');d('The bottle still feels warm.')}},
    {l:'Wait it out. Heal 10% of your HP.',f:d=>{S.hp=Math.min(S.maxHp,S.hp+Math.floor(S.maxHp*.1));sfx('heal');d('You nap behind a rock until it passes.')}}]},
{id:'deja',n:'Déjà Vu',look:'pip',txt:()=>'You have definitely been here before. You have definitely been here before.',
 o:[{l:'Relive a moment: duplicate a card in your deck.',f:d=>chooseCard(S.deck,'Duplicate a card',c=>{addCard(c.id,c.up);sfx('ghost');d(`There are two of ${CARDS[c.id].n} now. There always were.`)},{onCancel:()=>d('The feeling fades.')})},{l:'Shake it off.'}]}];
function showEvent(){let pool=EVENTS.filter(e=>!S.seenEv.includes(e.id));if(!pool.length){S.seenEv=[];pool=EVENTS}const ev=pick(pool);S.seenEv.push(ev.id);renderEvent(ev)}
function renderEvent(ev,after){const m=misc(`<div class="center" style="padding-left:380px;align-items:flex-start"><div class="panel" style="max-width:700px"><h2 style="font-size:32px;margin-bottom:8px">${ev.n}</h2><p style="font-size:18px;line-height:1.45;margin-bottom:18px">${after||ev.txt()}</p><div class="choice">${after?'<button class="btn pri" data-o="-1">Continue</button>':ev.o.map((o,i)=>{const ok=!o.c||o.c();return`<button class="btn ${ok?'':'off'}" data-o="${i}">${typeof o.l==='function'?o.l():o.l}</button>`}).join('')}</div></div></div>`);
  miscBlob('ev',ev.look,250,1);
  $$('[data-o]',m).forEach(b=>b.onclick=()=>{const i=+b.dataset.o;if(i<0||!ev.o[i].f){toMap();return}ev.o[i].f(t=>renderEvent(ev,t))})}
function stats(){return`Act ${S.act}, floor ${S.floor} · ${S.stats.kills} blobs bopped · ${S.stats.rewinds} rewind${S.stats.rewinds===1?'':'s'} · ${S.stats.cards} cards played`}
function defeat(){if(B)B.on=0;U.busy=false;clearSave();bumpBest(false);sfx('lose');
  const m=misc(`<div class="center" style="padding-left:300px"><div class="panel" style="text-align:center;max-width:620px"><h2 style="font-size:48px">Out of time</h2><p style="font-size:18px;margin:8px 0">Pip melts into a small, disappointed puddle. If only you could rewind that one.</p><p class="small dim" style="margin-bottom:20px">${stats()}</p><button class="btn pri big" id="dn">Try again</button> <button class="btn big" id="dt">Title</button></div></div>`);
  miscBlob('end','pipsad',250,1).sq=.4;$('#dn',m).onclick=newRun;$('#dt',m).onclick=showTitle}
function victory(){clearSave();bumpBest(true);sfx('win');
  const m=misc(`<div class="center" style="padding-left:300px"><div class="panel" style="text-align:center;max-width:640px"><h2 style="font-size:48px">You beat yourself</h2><p style="font-size:18px;margin:8px 0">Literally. Old Pip pats you on the head, says "I knew you would," and fades out of a timeline that no longer needs him.</p><p class="small dim" style="margin-bottom:20px">${stats()}</p><button class="btn pri big" id="dn">New run</button> <button class="btn big" id="dt">Title</button></div></div>`);
  miscBlob('end','pip',250,1);$('#dn',m).onclick=newRun;$('#dt',m).onclick=showTitle}

/* ---------- top bar ---------- */
function renderTop(){if(!S)return;const t=$('#top'),inB=B&&B.on,hp=inB?B.player.hp:S.hp,tn=inB?B.tonics:S.tonics;
  setH(t,`<div class="stat" data-tip="Health">${I('heart',24,'#ff5d6c')} ${Math.max(0,hp)}/${S.maxHp}</div><div class="stat" data-tip="Gold">${I('coin',24)} ${S.gold}</div><div id="tonics">${tn.map((id,i)=>`<div class="tonic ${id?'full':''}" data-ti="${i}" data-tipf="t:${i}">${id?tonicIcon(id):''}</div>`).join('')}</div><div id="relics">${S.relics.map(r=>`<div class="relic ${r==='locket'&&inB&&B.meta.locket?'used':''}" data-tipf="r:${r}" style="background:${RELICS[r].c}">${I(RELICS[r].ic,22)}</div>`).join('')}</div><div class="sp"></div><div class="floor">Act ${S.act} · Floor ${S.floor}</div><button class="tbtn" id="bdeck" data-tip="Your deck (D)">${I('deck',15)} ${S.deck.length}</button><button class="tbtn ${AU.sfx?'':'off'}" id="bsfx">SFX</button><button class="tbtn ${AU.music?'':'off'}" id="bmus">Music</button><button class="tbtn" id="bquit">Title</button>`)}

/* ---------- title ---------- */
function save(){try{if(S)localStorage.setItem('rewind.run',JSON.stringify(S))}catch(e){}}
function loadSave(){try{return JSON.parse(localStorage.getItem('rewind.run'))}catch(e){return null}}
function clearSave(){try{localStorage.removeItem('rewind.run')}catch(e){}}
function best(){try{return Object.assign({runs:0,wins:0,floor:0},JSON.parse(localStorage.getItem('rewind.best')||'{}'))}catch(e){return{runs:0,wins:0,floor:0}}}
function bumpBest(win){const b=best();b.runs++;if(win)b.wins++;b.floor=Math.max(b.floor,S.floor);try{localStorage.setItem('rewind.best',JSON.stringify(b))}catch(e){}}
function showTitle(){B=null;const sv=loadSave();show('title');const b=best(),t=$('#title');
  t.innerHTML=`<div class="logo"><h1>${[...'REWIND'].map((ch,i)=>`<span style="animation-delay:${-i*.3}s">${ch}</span>`).join('')}</h1><div class="tag">A roguelike deckbuilder where any turn can be taken back.</div></div><div class="menu"><button class="btn big pri" id="tnew">New run</button>${sv?`<button class="btn big teal" id="tcont">Continue <small class="dim">act ${sv.act} · floor ${sv.floor}</small></button>`:''}<button class="btn big" id="thow">How to play</button></div><div class="meta">${b.runs?`Runs ${b.runs} · Wins ${b.wins} · Best floor ${b.floor} · `:''}<button class="tbtn ${AU.sfx?'':'off'}" id="tsfx">SFX</button> <button class="tbtn ${AU.music?'':'off'}" id="tmus">Music</button></div>`;
  [['t1','pip',290,1],['t2','drip',800,-1],['t3','cuckoo',940,-1],['t4','gloop',1090,-1]].forEach(([k,l,x,f])=>t.append(makeBlob(k,l,x,f).el));
  $('#tnew').onclick=()=>{if(sv)confirmBox('Start over? Your saved run will be lost.',()=>{clearSave();newRun()});else newRun()};
  if(sv)$('#tcont').onclick=()=>{S=sv;toMap()};
  $('#thow').onclick=howTo;
  $('#tsfx').onclick=()=>{AU.sfx=!AU.sfx;saveAudio();showTitle()};$('#tmus').onclick=()=>{setMusic(!AU.music);showTitle()}}
function howTo(){const o=overlay(`<div class="panel howto"><h2 style="color:var(--ink);text-shadow:none;font-size:32px;text-align:center">How to play</h2><div class="cols">
  <div><h3>The basics</h3>Climb two maps of blobs and beat the boss at the top of each. Every turn you get 3 Energy and draw 5 cards. Click a card to play it; with several enemies, attacks ask for a target. The bubble above each enemy says what it will do when you end your turn.</div>
  <div><h3>Sand and the film strip</h3>Each turn is saved as a frame on the strip at the top. You gain 1 <b>Sand</b> per turn, up to 5. Sand pays for time cards and for rewinding a whole turn.</div>
  <div><h3>Rewind the Turn</h3>For 3 Sand, go back to the start of your previous turn. Your HP, hand, piles, tonics and the enemies all return as they were. Enemies repeat what they did unless you change something, and a note reminds you what happened last time. Each rewind slips a Paradox into your draw pile.</div>
  <div><h3>The Time Capsule</h3>Before rewinding, send up to 2 cards from your hand into the capsule. They arrive in the past as <b>Ghosts</b>: free to play, gone after one use. Sending a card removes it from the current timeline.</div>
  <div><h3>Time cards</h3><b>Rewind yourself</b> to undo damage. <b>Unmake</b> an enemy to strip the Strength and Block it built, push its plan back, or erase a minion that was summoned later. <b>Déjà Vu</b> makes it repeat its last move. <b>Stasis</b> freezes it. <b>Echo</b> repeats a card next turn.</div>
  <div><h3>Watch out</h3>Some foes turn their own HP back. <b>Anchor</b> them, drain their Sand, or time your big hits for after. Tonics you drink before a rewind come back with it.<br><br><span class="small dim">Keys: 1–0 play a card · E end turn · R rewind · C capsule · D deck · Esc or right-click cancels</span></div>
  </div><div style="text-align:center;margin-top:14px"><button class="btn pri" id="hok">Got it</button></div></div>`);$('#hok',o).onclick=()=>o.remove()}

/* ---------- boot ---------- */
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);U.scale=s;stage.style.transform=`scale(${s})`;stage.style.left=((innerWidth-1280*s)/2)+'px';stage.style.top=((innerHeight-720*s)/2)+'px'}
function makeClouds(){const c=$('#clouds');let h='';for(let i=0;i<6;i++){const w=90+mix(i*7)*120,y=70+mix(i*13)*170,d=70+mix(i*5)*80;h+=`<div class="cloud" style="width:${w}px;height:${w*.32}px;top:${y}px;animation-duration:${d}s;animation-delay:${-mix(i*3)*d}s"></div>`}c.innerHTML=h}
stage.addEventListener('scroll',()=>{stage.scrollTop=0;stage.scrollLeft=0});
U.scale=1;fit();addEventListener('resize',fit);makeClouds();if(REDUCE)stage.classList.add('reduce');requestAnimationFrame(animLoop);showTitle();
window.REWIND={get S(){return S},get B(){return B},set S(v){S=v},newRun,startBattle,endTurn,playCard,rewindTurn,sendCard,toMap,enterNode,ENC,CARDS};
</script>
